[project]
name = "maxibot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.14", "psycopg[binary]>=3.2", "psycopg2-binary>=2.9", "redis>=5.2", "pydantic-settings>=2.7", "jinja2>=3.1", "httpx>=0.28", "cryptography>=43", "webauthn>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "aiosqlite>=0.20", "httpx>=0.28", "Pillow>=10"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
