name: MAXIBOT — Read-only release diagnostics
run-name: MAXIBOT evidence diagnostics ${{ inputs.candidate_sha }} run ${{ inputs.original_run_id }} attempt ${{ inputs.original_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA from the original Deploy
        required: true
        type: string
      original_run_id:
        description: Original Deploy workflow run ID, not this diagnostic run
        required: true
        type: string
      original_run_attempt:
        description: Original Deploy attempt, not this diagnostic attempt
        required: true
        type: string
      evidence_digest:
        description: Expected immutable GHCR evidence digest of the original attempt
        required: true
        type: string
      prepare_receipt_digest:
        description: Prepare receipt digest recorded in the original Deployment payload
        required: true
        type: string
      authorization_id:
        description: Durable authorization ID used by the original release
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      deployments: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify trusted ref and exact original inputs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          PREPARE_RECEIPT_DIGEST: ${{ inputs.prepare_receipt_digest }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ORIGINAL_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PREPARE_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AUTHORIZATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
      - name: Read original immutable evidence and GitHub Deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
          PREPARE_RECEIPT_DIGEST: ${{ inputs.prepare_receipt_digest }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          python3 scripts/maxibot_release_diagnostics.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$ORIGINAL_RUN_ID" \
            --run-attempt "$ORIGINAL_RUN_ATTEMPT" \
            --evidence-digest "$EVIDENCE_DIGEST" \
            --prepare-receipt-digest "$PREPARE_RECEIPT_DIGEST" \
            --authorization-id "$AUTHORIZATION_ID" \
            --output "$RUNNER_TEMP/maxibot-release-diagnostics"
