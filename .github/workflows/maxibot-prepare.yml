name: MAXIBOT — Prepare
run-name: Prepare MAXIBOT ${{ inputs.candidate || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Exact full SHA to re-check (must still be current main)'
        required: true
        type: string
      owner_approved_task:
        description: 'Linear issue or task authorizing a frozen production path change, if applicable'
        required: false
        type: string
      owner_approved_paths:
        description: 'Comma-separated protected paths covered by that owner approval, if applicable'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-prepare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  coalesce:
    # Keep the bounded quiet wait on the trusted MAXIBOT Mac runner. If this
    # runner is offline, the paid Ubuntu Prepare remains skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, maxibot-production]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      result: ${{ steps.coalesce.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Wait for a quiet main and verify the exact candidate
        id: coalesce
        env:
          CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_coalescing.py

  prepare:
    # This job needs a write-capable GITHUB_TOKEN to publish the immutable
    # Release. Never execute a branch-selected workflow with that permission.
    if: github.ref == 'refs/heads/main' && needs.coalesce.result == 'success' && needs.coalesce.outputs.result == 'WINNER'
    needs: coalesce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      coalescing: ${{ needs.coalesce.outputs.result }}
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
      OWNER_APPROVED_TASK: ${{ inputs.owner_approved_task }}
      OWNER_APPROVED_PATHS: ${{ inputs.owner_approved_paths }}
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0

      - name: Verify exact current main SHA
        if: needs.coalesce.outputs.result == 'WINNER'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          echo "EXACT_SHA=PASS ($CANDIDATE_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set deterministic Python runtime
        if: needs.coalesce.outputs.result == 'WINNER'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate patch and frozen paid-traffic paths
        if: needs.coalesce.outputs.result == 'WINNER'
        id: frozen
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          args=()
          if [[ -n "$OWNER_APPROVED_TASK" ]]; then
            args+=(--owner-approved-task "$OWNER_APPROVED_TASK")
          fi
          if [[ -n "$OWNER_APPROVED_PATHS" ]]; then
            IFS=',' read -r -a paths <<< "$OWNER_APPROVED_PATHS"
            for path in "${paths[@]}"; do
              [[ -n "$path" ]]
              args+=(--owner-approved-path "$path")
            done
          fi
          bash scripts/frozen_path_guard.sh --base "$BASE_SHA" --head "$CANDIDATE_SHA" "${args[@]}"
          echo "FROZEN_PATH_GUARD=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan MAXIBOT V3 from immutable production evidence
        if: needs.coalesce.outputs.result == 'WINNER'
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B scripts/maxibot_impact_v3.py --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/maxibot-v3-impact.json"

      - name: Install isolated test dependencies
        if: needs.coalesce.outputs.result == 'WINNER'
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/maxibot-test-requirements.txt"
          import tomllib
          with open("pyproject.toml", "rb") as source:
              config = tomllib.load(source)["project"]
          requirements = config["dependencies"] + config["optional-dependencies"]["test"]
          print("\n".join(requirements))
          PY
          python3 -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/maxibot-test-requirements.txt"

      - name: Pin Docker build version; rehearse production store separately
        if: needs.coalesce.outputs.result == 'WINNER'
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: v29.1.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}

      - name: Run V3 exact-candidate required test suite
        if: needs.coalesce.outputs.result == 'WINNER'
        id: tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m unittest tests.test_unified_release_v1
          python3 -B scripts/maxibot_impact_v3.py --candidate "$CANDIDATE_SHA" --run-tests "$RUNNER_TEMP/maxibot-v3-impact.json"

      - name: Enable BuildKit cross-run cache (no image identity reuse)
        if: needs.coalesce.outputs.result == 'WINNER'
        uses: docker/setup-buildx-action@v3

      - name: Build and verify canonical linux/amd64 candidate image
        if: needs.coalesce.outputs.result == 'WINNER'
        id: image
        env:
          IMAGE: maxibot-vps-api:${{ inputs.candidate || github.sha }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maxibot-image"
          docker buildx build --load --platform linux/amd64 \
            --cache-from type=gha,scope=maxibot-v3 \
            --cache-to type=gha,scope=maxibot-v3,mode=max,ignore-error=true \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.source-sha=$CANDIDATE_SHA" \
            --label "org.maxibot.release.sha=$CANDIDATE_SHA" \
            --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}|{{index .Config.Labels "org.opencontainers.image.revision"}}|{{index .Config.Labels "org.opencontainers.image.source-sha"}}|{{index .Config.Labels "org.maxibot.release.sha"}}' \
            | grep -Fx "linux/amd64|$CANDIDATE_SHA|$CANDIDATE_SHA|$CANDIDATE_SHA"
          NATIVE_IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          docker save "$IMAGE" | gzip -1 > "$IMAGE_ARCHIVE"
          ARCHIVE_SHA256="$(sha256sum "$IMAGE_ARCHIVE" | awk '{print $1}')"
          ARCHIVE_CONFIG_ID="$(python3 - "$IMAGE_ARCHIVE" "$IMAGE" "$CANDIDATE_SHA" <<'PY'
          import sys
          from pathlib import Path
          from scripts.prepared_image_archive import inspect_prepared_archive
          print(inspect_prepared_archive(Path(sys.argv[1]), sys.argv[2], sys.argv[3])[0])
          PY
          )"
          python3 - "$RUNNER_TEMP/maxibot-image/maxibot-image-manifest.json" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARCHIVE_CONFIG_ID" "$NATIVE_IMAGE_ID" "$ARCHIVE_SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          path, sha, run_id, attempt, image_id, native_image_id, archive_sha256 = sys.argv[1:]
          Path(path).write_text(json.dumps({
              "schema": "MAXIBOT_PREPARED_IMAGE_V1",
              "candidate_sha": sha,
              "prepare_run_id": run_id,
              "prepare_run_attempt": attempt,
              "image": f"maxibot-vps-api:{sha}",
              "image_id": image_id,
              "native_image_id": native_image_id,
              "archive_sha256": archive_sha256,
              "platform": "linux/amd64",
              "labels": {
                  "org.opencontainers.image.revision": sha,
                  "org.opencontainers.image.source-sha": sha,
                  "org.maxibot.release.sha": sha,
              },
          }, sort_keys=True) + "\n")
          PY
          echo "IMAGE_ID=$ARCHIVE_CONFIG_ID" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          echo "LINUX_AMD64_CANDIDATE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate trusted MAXIBOT Prepare for GHCR publication
        if: needs.coalesce.outputs.result == 'WINNER'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image manifest digest
        if: needs.coalesce.outputs.result == 'WINNER'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/publish_maxibot_ghcr.py

      - name: Rehearse archive import in private Docker/containerd
        if: needs.coalesce.outputs.result == 'WINNER'
        id: rehearsal
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-image/maxibot-image-manifest.json
        run: python3 scripts/rehearse_private_docker.py

      - name: Write CI result receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          IMAGE_STATUS: ${{ steps.image.outcome }}
          FROZEN_STATUS: ${{ steps.frozen.outcome }}
          REHEARSAL_STATUS: ${{ steps.rehearsal.outcome }}
          COALESCING_RESULT: ${{ needs.coalesce.outputs.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          sha = os.environ["CANDIDATE_SHA"]
          coalescing = os.environ.get("COALESCING_RESULT", "BLOCKED")
          status = "SUPERSEDED" if coalescing == "SUPERSEDED" else ("READY" if (
              os.environ["JOB_STATUS"] == "success"
              and coalescing == "WINNER"
              and os.environ.get("TEST_STATUS") == "success"
              and os.environ.get("FROZEN_STATUS") == "success"
              and os.environ.get("IMAGE_STATUS") == "success"
              and os.environ.get("REHEARSAL_STATUS") == "success"
              and os.environ.get("MAXIBOT_PRIVATE_REHEARSAL") == "PASS"
          ) else "FAILED")
          from pathlib import Path
          from scripts.maxibot_impact_v3 import verify_plan
          impact_path = Path(os.environ["RUNNER_TEMP"]) / "maxibot-v3-impact.json"
          impact_v3 = json.loads(impact_path.read_text()) if impact_path.is_file() else None
          if status == "READY":
              if not impact_v3:
                  raise RuntimeError("Missing V3 impact plan for READY candidate")
              test_scope = verify_plan(impact_v3, Path.cwd(), sha)
          else:
              test_scope = "FULL"
          result = {
              "schema": "MAXIBOT_PREPARE_RECEIPT_V1",
              "test_scope": test_scope,
              "impact_v3": impact_v3 if test_scope == "UI_ONLY" else None,
              "candidate_sha": sha,
              "status": status,
              "coalescing": coalescing,
              "quiet_window_seconds": 60,
              "tests": os.environ.get("TEST_STATUS", "skipped"),
              "frozen_path_guard": os.environ.get("FROZEN_STATUS", "skipped"),
              "linux_amd64_image": os.environ.get("IMAGE_STATUS", "skipped"),
              "private_rehearsal_seconds": os.environ.get("MAXIBOT_PRIVATE_SECONDS", ""),
              "private_docker_rehearsal": os.environ.get("MAXIBOT_PRIVATE_REHEARSAL", "skipped"),
              "private_docker_version": os.environ.get("MAXIBOT_PRIVATE_DOCKER_VERSION", "skipped"),
              "private_store": os.environ.get("MAXIBOT_PRIVATE_STORE", "skipped"),
              "private_snapshotter": os.environ.get("MAXIBOT_PRIVATE_SNAPSHOTTER", "skipped"),
              "private_network_isolated": os.environ.get("MAXIBOT_PRIVATE_NETWORK_ISOLATED", "skipped"),
              "rehearsal_candidate_sha": os.environ.get("MAXIBOT_PRIVATE_CANDIDATE_SHA", ""),
              "rehearsal_prepare_run_id": os.environ.get("MAXIBOT_PRIVATE_PREPARE_RUN_ID", ""),
              "rehearsal_archive_sha256": os.environ.get("MAXIBOT_PRIVATE_ARCHIVE_SHA256", ""),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          os.makedirs(os.path.join(os.environ["RUNNER_TEMP"], "maxibot-image"), exist_ok=True)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "maxibot-image", "maxibot-prepare-result.json"), "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n## MAXIBOT candidate: {result['status']}\n\nSHA: `{sha}`\n")
          PY

      - name: Publish immutable Prepare Release bundle
        if: github.ref == 'refs/heads/main' && job.status == 'success' && needs.coalesce.outputs.result == 'WINNER'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_assets.py publish-prepare

  publish:
    needs: [coalesce, prepare]
    if: always() && github.ref == 'refs/heads/main' && needs.coalesce.result == 'success' && needs.coalesce.outputs.result == 'WINNER' && needs.prepare.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maxibot-linear-release
      cancel-in-progress: false
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Measure Prepare runner usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEMETRY_RUN_IDS: ${{ github.run_id }}
          CACHE_PREVENTED_DOWNLOAD: NO
        run: |
          python3 scripts/release_telemetry.py
          cat "$GITHUB_OUTPUT" >> "$GITHUB_ENV"
      - name: Publish final Prepare result to MAXIBOT Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PHASE: candidate
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/publish_release_to_linear.py

  v3-branch-rehearsal:
    # Read-only workflow branch: no immutable Release writes and NO production.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
    steps:
      - name: Checkout branch candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set deterministic Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify no frozen production paths are changed
        run: |
          git fetch origin main --quiet
          git diff --check origin/main HEAD
          bash scripts/frozen_path_guard.sh --base "$(git rev-parse origin/main)" --head "$CANDIDATE_SHA"
      - name: Verify branch cannot claim a production UI-only scope
        run: |
          GITHUB_REF=refs/heads/v3-test python3 -B scripts/maxibot_impact_v3.py --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/maxibot-v3-impact.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/maxibot-v3-impact.json")); assert p["classification"]=="FULL"'
      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/maxibot-test-requirements.txt"
          import tomllib
          with open("pyproject.toml", "rb") as source:
              config = tomllib.load(source)["project"]
          requirements = config["dependencies"] + config["optional-dependencies"]["test"]
          print("\n".join(requirements))
          PY
          python3 -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/maxibot-test-requirements.txt"

      - name: Execute complete MAXIBOT safety and application test suite
        run: python3 -m pytest -q
      - name: Pin Docker build version; rehearse production store separately
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: v29.1.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}

      - name: Enable BuildKit cross-run cache (no image identity reuse)
        uses: docker/setup-buildx-action@v3

      - name: Build and verify canonical linux/amd64 candidate image
        id: image
        env:
          IMAGE: maxibot-vps-api:${{ inputs.candidate || github.sha }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maxibot-image"
          docker buildx build --load --platform linux/amd64 \
            --cache-from type=gha,scope=maxibot-v3 \
            --cache-to type=gha,scope=maxibot-v3,mode=max,ignore-error=true \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.source-sha=$CANDIDATE_SHA" \
            --label "org.maxibot.release.sha=$CANDIDATE_SHA" \
            --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}|{{index .Config.Labels "org.opencontainers.image.revision"}}|{{index .Config.Labels "org.opencontainers.image.source-sha"}}|{{index .Config.Labels "org.maxibot.release.sha"}}' \
            | grep -Fx "linux/amd64|$CANDIDATE_SHA|$CANDIDATE_SHA|$CANDIDATE_SHA"
          NATIVE_IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          docker save "$IMAGE" | gzip -1 > "$IMAGE_ARCHIVE"
          ARCHIVE_SHA256="$(sha256sum "$IMAGE_ARCHIVE" | awk '{print $1}')"
          ARCHIVE_CONFIG_ID="$(python3 - "$IMAGE_ARCHIVE" "$IMAGE" "$CANDIDATE_SHA" <<'PY'
          import sys
          from pathlib import Path
          from scripts.prepared_image_archive import inspect_prepared_archive
          print(inspect_prepared_archive(Path(sys.argv[1]), sys.argv[2], sys.argv[3])[0])
          PY
          )"
          python3 - "$RUNNER_TEMP/maxibot-image/maxibot-image-manifest.json" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARCHIVE_CONFIG_ID" "$NATIVE_IMAGE_ID" "$ARCHIVE_SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          path, sha, run_id, attempt, image_id, native_image_id, archive_sha256 = sys.argv[1:]
          Path(path).write_text(json.dumps({
              "schema": "MAXIBOT_PREPARED_IMAGE_V1",
              "candidate_sha": sha,
              "prepare_run_id": run_id,
              "prepare_run_attempt": attempt,
              "image": f"maxibot-vps-api:{sha}",
              "image_id": image_id,
              "native_image_id": native_image_id,
              "archive_sha256": archive_sha256,
              "platform": "linux/amd64",
              "labels": {
                  "org.opencontainers.image.revision": sha,
                  "org.opencontainers.image.source-sha": sha,
                  "org.maxibot.release.sha": sha,
              },
          }, sort_keys=True) + "\n")
          PY
          echo "IMAGE_ID=$ARCHIVE_CONFIG_ID" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          echo "LINUX_AMD64_CANDIDATE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Rehearse archive import in private Docker/containerd
        id: rehearsal
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-image/maxibot-image-manifest.json
        run: python3 scripts/rehearse_private_docker.py
