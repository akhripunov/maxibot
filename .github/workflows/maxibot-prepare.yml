name: MAXIBOT — Prepare
run-name: Prepare MAXIBOT ${{ inputs.candidate || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Exact full SHA to re-check (must still be current main)'
        required: true
        type: string
      owner_approved_task:
        description: 'Linear issue or task authorizing a frozen production path change, if applicable'
        required: false
        type: string
      owner_approved_paths:
        description: 'Comma-separated protected paths covered by that owner approval, if applicable'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    # This job needs a write-capable GITHUB_TOKEN to publish the immutable
    # Release. Never execute a branch-selected workflow with that permission.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
      OWNER_APPROVED_TASK: ${{ inputs.owner_approved_task }}
      OWNER_APPROVED_PATHS: ${{ inputs.owner_approved_paths }}
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0

      - name: Set deterministic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify exact current main SHA
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          echo "EXACT_SHA=PASS ($CANDIDATE_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate patch and frozen paid-traffic paths
        id: frozen
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          args=()
          if [[ -n "$OWNER_APPROVED_TASK" ]]; then
            args+=(--owner-approved-task "$OWNER_APPROVED_TASK")
          fi
          if [[ -n "$OWNER_APPROVED_PATHS" ]]; then
            IFS=',' read -r -a paths <<< "$OWNER_APPROVED_PATHS"
            for path in "${paths[@]}"; do
              [[ -n "$path" ]]
              args+=(--owner-approved-path "$path")
            done
          fi
          bash scripts/frozen_path_guard.sh --base "$BASE_SHA" --head "$CANDIDATE_SHA" "${args[@]}"
          echo "FROZEN_PATH_GUARD=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/maxibot-test-requirements.txt"
          import tomllib
          with open("pyproject.toml", "rb") as source:
              config = tomllib.load(source)["project"]
          requirements = config["dependencies"] + config["optional-dependencies"]["test"]
          print("\n".join(requirements))
          PY
          python3 -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/maxibot-test-requirements.txt"

      - name: Pin Docker build version; rehearse production store separately
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: v29.1.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}

      - name: Run complete MAXIBOT test suite
        id: tests
        run: python3 -m pytest -q

      - name: Build and verify canonical linux/amd64 candidate image
        id: image
        env:
          IMAGE: maxibot-vps-api:${{ inputs.candidate || github.sha }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maxibot-image"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.source-sha=$CANDIDATE_SHA" \
            --label "org.maxibot.release.sha=$CANDIDATE_SHA" \
            --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}|{{index .Config.Labels "org.opencontainers.image.revision"}}|{{index .Config.Labels "org.opencontainers.image.source-sha"}}|{{index .Config.Labels "org.maxibot.release.sha"}}' \
            | grep -Fx "linux/amd64|$CANDIDATE_SHA|$CANDIDATE_SHA|$CANDIDATE_SHA"
          NATIVE_IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          docker save "$IMAGE" | gzip -1 > "$IMAGE_ARCHIVE"
          ARCHIVE_SHA256="$(sha256sum "$IMAGE_ARCHIVE" | awk '{print $1}')"
          ARCHIVE_CONFIG_ID="$(python3 - "$IMAGE_ARCHIVE" "$IMAGE" "$CANDIDATE_SHA" <<'PY'
          import sys
          from pathlib import Path
          from scripts.prepared_image_archive import inspect_prepared_archive
          print(inspect_prepared_archive(Path(sys.argv[1]), sys.argv[2], sys.argv[3])[0])
          PY
          )"
          python3 - "$RUNNER_TEMP/maxibot-image/maxibot-image-manifest.json" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARCHIVE_CONFIG_ID" "$NATIVE_IMAGE_ID" "$ARCHIVE_SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          path, sha, run_id, attempt, image_id, native_image_id, archive_sha256 = sys.argv[1:]
          Path(path).write_text(json.dumps({
              "schema": "MAXIBOT_PREPARED_IMAGE_V1",
              "candidate_sha": sha,
              "prepare_run_id": run_id,
              "prepare_run_attempt": attempt,
              "image": f"maxibot-vps-api:{sha}",
              "image_id": image_id,
              "native_image_id": native_image_id,
              "archive_sha256": archive_sha256,
              "platform": "linux/amd64",
              "labels": {
                  "org.opencontainers.image.revision": sha,
                  "org.opencontainers.image.source-sha": sha,
                  "org.maxibot.release.sha": sha,
              },
          }, sort_keys=True) + "\n")
          PY
          echo "IMAGE_ID=$ARCHIVE_CONFIG_ID" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ARCHIVE_SHA256=$ARCHIVE_SHA256" >> "$GITHUB_OUTPUT"
          echo "LINUX_AMD64_CANDIDATE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Rehearse archive import in private Docker/containerd
        id: rehearsal
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-image/maxibot-image-${{ inputs.candidate || github.sha }}.tar.gz
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-image/maxibot-image-manifest.json
        run: python3 scripts/rehearse_private_docker.py

      - name: Write CI result receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          IMAGE_STATUS: ${{ steps.image.outcome }}
          FROZEN_STATUS: ${{ steps.frozen.outcome }}
          REHEARSAL_STATUS: ${{ steps.rehearsal.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          sha = os.environ["CANDIDATE_SHA"]
          status = "READY" if (
              os.environ["JOB_STATUS"] == "success"
              and os.environ.get("TEST_STATUS") == "success"
              and os.environ.get("FROZEN_STATUS") == "success"
              and os.environ.get("IMAGE_STATUS") == "success"
              and os.environ.get("REHEARSAL_STATUS") == "success"
              and os.environ.get("MAXIBOT_PRIVATE_REHEARSAL") == "PASS"
          ) else "FAILED"
          result = {
              "schema": "MAXIBOT_PREPARE_RECEIPT_V1",
              "candidate_sha": sha,
              "status": status,
              "tests": os.environ.get("TEST_STATUS", "skipped"),
              "frozen_path_guard": os.environ.get("FROZEN_STATUS", "skipped"),
              "linux_amd64_image": os.environ.get("IMAGE_STATUS", "skipped"),
              "private_rehearsal_seconds": os.environ.get("MAXIBOT_PRIVATE_SECONDS", ""),
              "private_docker_rehearsal": os.environ.get("MAXIBOT_PRIVATE_REHEARSAL", "skipped"),
              "private_docker_version": os.environ.get("MAXIBOT_PRIVATE_DOCKER_VERSION", "skipped"),
              "private_store": os.environ.get("MAXIBOT_PRIVATE_STORE", "skipped"),
              "private_snapshotter": os.environ.get("MAXIBOT_PRIVATE_SNAPSHOTTER", "skipped"),
              "private_network_isolated": os.environ.get("MAXIBOT_PRIVATE_NETWORK_ISOLATED", "skipped"),
              "rehearsal_candidate_sha": os.environ.get("MAXIBOT_PRIVATE_CANDIDATE_SHA", ""),
              "rehearsal_prepare_run_id": os.environ.get("MAXIBOT_PRIVATE_PREPARE_RUN_ID", ""),
              "rehearsal_archive_sha256": os.environ.get("MAXIBOT_PRIVATE_ARCHIVE_SHA256", ""),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          os.makedirs(os.path.join(os.environ["RUNNER_TEMP"], "maxibot-image"), exist_ok=True)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "maxibot-image", "maxibot-prepare-result.json"), "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\n## MAXIBOT candidate: {result['status']}\n\nSHA: `{sha}`\n")
          PY

      - name: Publish immutable Prepare Release bundle
        if: github.ref == 'refs/heads/main' && job.status == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_assets.py publish-prepare

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maxibot-linear-release
      cancel-in-progress: false
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish final Prepare result to MAXIBOT Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PHASE: candidate
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CANDIDATE_SHA: ${{ inputs.candidate || github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/publish_release_to_linear.py
