name: MAXIBOT — Automatic preflight controller
run-name: Auto preflight MAXIBOT ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["MAXIBOT — Prepare", "MAXIBOT — Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-auto-preflight-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch-preflight:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha &&
      (github.event.workflow_run.path == '.github/workflows/maxibot-prepare.yml' ||
       (github.event.workflow_run.path == '.github/workflows/maxibot-deploy.yml' &&
        startsWith(github.event.workflow_run.display_title, format('MAXIBOT preflight {0} by ', github.event.workflow_run.head_sha))))
    runs-on: [self-hosted, macOS, maxibot-production]
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted current main controller code
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - name: Verify assigned runner before controller/API work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release_runner_readiness.py
      - name: Continue exact Prepare or READY preflight through the existing release workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/release_orchestrator.py
