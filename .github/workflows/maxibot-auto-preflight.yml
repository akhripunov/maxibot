name: MAXIBOT — Automatic release controller
run-name: Auto release MAXIBOT ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["MAXIBOT — Prepare"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-auto-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch-authorized-deploy:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.path == '.github/workflows/maxibot-prepare.yml'
    runs-on: [self-hosted, macOS, maxibot-production]
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
      packages: read
    steps:
      - name: Checkout trusted current main controller code
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - name: Verify assigned runner before controller/API work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release_runner_readiness.py
      - name: Dispatch one authorized Deploy or leave exact-SHA approval required
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/release_orchestrator.py
