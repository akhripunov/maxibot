          worker="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker)" || fail worker-query
          [[ "$worker" =~ ^[0-9a-f]{64}$ ]] || fail worker-cardinality
          worker_sha="$(docker inspect "$worker" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MAXIBOT_COMMIT_SHA=//p')" || fail worker-sha-read
          [[ "$worker_sha" == "$expected_prod_sha" ]] || fail worker-source-sha-drift
          db=maxibot-vps-db-1
          [[ "$(docker inspect "$db" --format '{{.Id}}')" == "$expected_db_id" ]] || fail db-container-identity-changed
          db_volume="$(docker inspect "$db" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')" || fail db-volume-read
          [[ -n "$db_volume" && "$db_volume" == "$expected_db_volume" ]] || fail db-volume-identity-changed
          [[ "$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')" == "$expected_db_head" ]] || fail db-head-drift
          backup_dir=/opt/maxibot/backups
          install -d -m 700 "$backup_dir"
          backup="$backup_dir/maxibot-db-migration-$run_id.dump"
          [[ ! -e "$backup" ]] || fail backup-path-exists
          db_image="$(docker inspect "$db" --format '{{.Image}}')" || fail db-image-read
          db_data_dir="$(docker inspect "$db" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Source}}{{end}}{{end}}')" || fail db-volume-read
          [[ -n "$db_data_dir" && -d "$db_data_dir" ]] || fail db-data-path
          data_bytes="$(du -sb "$db_data_dir" | awk '{print $1}')"
          free_bytes="$(df -PB1 "$backup_dir" | awk 'NR == 2 {print $4}')"
          [[ "$data_bytes" =~ ^[0-9]+$ && "$free_bytes" =~ ^[0-9]+$ ]] || fail disk-capacity-read
          (( free_bytes >= data_bytes * 2 + 1073741824 )) || fail insufficient-preliminary-restore-space
          # SNAPSHOT_SESSION_HELPERS_BEGIN
          snapshot_dir=""
          snapshot_pid=""
          snapshot_fifo_open=0
          snapshot_id=""
          snapshot_cleanup() {
            local cleanup_failed=0
            if (( snapshot_fifo_open )); then
              if [[ -n "$snapshot_pid" ]]; then printf 'ROLLBACK;\n\\q\n' >&3 2>/dev/null || cleanup_failed=1; fi
              exec 3>&- || cleanup_failed=1
              snapshot_fifo_open=0
            fi
            if [[ -n "$snapshot_pid" ]]; then wait "$snapshot_pid" 2>/dev/null || cleanup_failed=1; snapshot_pid=""; fi
            if [[ -n "$snapshot_dir" && -d "$snapshot_dir" ]]; then rm -rf -- "$snapshot_dir" || cleanup_failed=1; fi
            snapshot_dir=""
            return "$cleanup_failed"
          }
          snapshot_exit_cleanup() {
            result=$?
            trap - EXIT
            snapshot_cleanup || { echo 'migration snapshot cleanup failed' >&2; result=1; }
            exit "$result"
          }
          snapshot_begin() {
            snapshot_dir="$(mktemp -d "$backup_dir/.migration-snapshot-$run_id.XXXXXX")" || return 1
            chmod 700 "$snapshot_dir" || return 1
            snapshot_fifo="$snapshot_dir/psql.in"
            snapshot_output="$snapshot_dir/psql.out"
            mkfifo -m 600 "$snapshot_fifo" || return 1
            exec 3<>"$snapshot_fifo" || return 1
            snapshot_fifo_open=1
            docker exec -i "$db" psql -X -qAt -v ON_ERROR_STOP=1 -U maxibot -d maxibot < "$snapshot_fifo" > "$snapshot_output" 2>&1 &
            snapshot_pid=$!
            printf 'BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;\nSELECT pg_export_snapshot();\n' >&3 || return 1
            for _ in $(seq 1 50); do
              snapshot_id="$(sed -n '1p' "$snapshot_output" 2>/dev/null || true)"
              [[ "$snapshot_id" =~ ^[0-9A-F]+-[0-9A-F]+-[0-9]+$ ]] && return 0
              kill -0 "$snapshot_pid" 2>/dev/null || { cat "$snapshot_output" >&2; return 1; }
              sleep 0.1
            done
            cat "$snapshot_output" >&2
            return 1
          }
          snapshot_release() {
            printf 'COMMIT;\n\\q\n' >&3 || return 1
            exec 3>&- || return 1
            snapshot_fifo_open=0
            wait "$snapshot_pid" || { snapshot_pid=""; return 1; }
            snapshot_pid=""
            snapshot_cleanup
          }
          # SNAPSHOT_SESSION_HELPERS_END
          trap snapshot_exit_cleanup EXIT
          snapshot_begin || fail snapshot-export
          snapshot_query() {
            local query="$1"
            docker exec "$db" psql -X -qAt -v ON_ERROR_STOP=1 -U maxibot -d maxibot -c "BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY; SET TRANSACTION SNAPSHOT '$snapshot_id'; $query; COMMIT;"
          }
          snapshot_preserved_counts() {
            local table rows
            for table in "${preserved_tables[@]}"; do
              rows="$(snapshot_query "select count(*) from public.\"$table\"")" || return 1
              [[ "$rows" =~ ^[0-9]+$ ]] || return 1
              printf '%s|%s\n' "$table" "$rows"
            done
          }
          source_head="$(snapshot_query 'select version_num from alembic_version')" || fail source-head-read
          [[ "$source_head" == "$expected_db_head" ]] || fail db-head-drift
          source_tables="$(snapshot_query "select table_schema || '.' || table_name from information_schema.tables where table_schema not in ('pg_catalog','information_schema') order by table_schema,table_name")" || fail source-table-inventory
          source_ext="$(snapshot_query "select string_agg(extname, ',' order by extname) from pg_extension")" || fail source-extension-read
          source_rows="$(snapshot_query 'select count(*) from offline_conversion_queue')" || fail source-queue-count
          source_queue_sha="$(snapshot_query "COPY (SELECT row_to_json(q)::text FROM offline_conversion_queue q ORDER BY id) TO STDOUT" | sha256sum | awk '{print $1}')" || fail source-queue-checksum
          source_preserved_counts="$(snapshot_preserved_counts)" || fail preserved-source-counts
          docker exec "$db" pg_dump -Fc --snapshot="$snapshot_id" -U maxibot -d maxibot > "$backup" || fail pg-dump
          snapshot_release || fail snapshot-release
          chmod 600 "$backup"
          backup_bytes="$(stat -c %s "$backup")"
          (( backup_bytes > 0 )) || fail backup-empty
          docker exec -i "$db" pg_restore --list < "$backup" >/dev/null || fail pg-restore-list
          free_bytes="$(df -PB1 "$backup_dir" | awk 'NR == 2 {print $4}')"
          [[ "$free_bytes" =~ ^[0-9]+$ ]] || fail disk-capacity-read
          (( free_bytes >= data_bytes + backup_bytes + 1073741824 )) || fail insufficient-restore-space
          restore_name="maxibot-migration-restore-$run_id"
          restore_ids="$(docker ps -aq --no-trunc --filter "name=^/$restore_name$")" || fail restore-container-query
          [[ -z "$restore_ids" ]] || fail restore-name-exists
          restore_data="$(mktemp -d "$backup_dir/.migration-restore-$run_id.XXXXXX")" || fail restore-temp-dir
          chmod 700 "$restore_data"
          cleanup() {
            result=$?; trap - EXIT HUP INT TERM; failed=0
            snapshot_cleanup || failed=1
            if ! ids="$(docker ps -aq --no-trunc --filter "name=^/$restore_name$")"; then failed=1
            elif [[ -n "$ids" ]]; then docker rm -f "$restore_name" >/dev/null || failed=1; fi
            if ! ids="$(docker ps -aq --no-trunc --filter "name=^/$restore_name$")"; then failed=1
            elif [[ -n "$ids" ]]; then failed=1; fi
            docker info >/dev/null 2>&1 || failed=1
            if (( failed == 0 )) && [[ -d "$restore_data" ]]; then rm -rf -- "$restore_data" || failed=1; fi
            if (( failed )); then echo 'isolated migration restore cleanup failed' >&2; result=1; fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          docker run -d --name "$restore_name" --network none --memory=1g --memory-swap=1g \
            --mount "type=bind,src=$restore_data,dst=/var/lib/postgresql/data" \
            --mount "type=bind,src=$backup,dst=/tmp/backup.dump,readonly" \
            -e POSTGRES_USER=maxibot -e POSTGRES_DB=postgres -e POSTGRES_HOST_AUTH_METHOD=trust "$db_image" >/dev/null || fail restore-container-start
          ready=0
          for _ in $(seq 1 60); do if docker exec "$restore_name" pg_isready -U maxibot -d postgres >/dev/null 2>&1; then ready=1; break; fi; sleep 1; done
          [[ "$ready" == 1 ]] || fail restore-postgres-ready
          docker exec "$restore_name" createdb -U maxibot maxibot_restore_probe || fail restore-create-db
          docker exec "$restore_name" pg_restore --exit-on-error --no-owner --no-privileges -U maxibot -d maxibot_restore_probe /tmp/backup.dump >/dev/null || fail isolated-pg-restore
          restored_tables="$(docker exec "$restore_name" psql -X -U maxibot -d maxibot_restore_probe -At -v ON_ERROR_STOP=1 -c "select table_schema || '.' || table_name from information_schema.tables where table_schema not in ('pg_catalog','information_schema') order by table_schema,table_name")" || fail restored-table-inventory
          restored_ext="$(docker exec "$restore_name" psql -X -U maxibot -d maxibot_restore_probe -At -v ON_ERROR_STOP=1 -c "select string_agg(extname, ',' order by extname) from pg_extension")" || fail restored-extension-read
          restored_rows="$(docker exec "$restore_name" psql -X -U maxibot -d maxibot_restore_probe -At -v ON_ERROR_STOP=1 -c 'select count(*) from offline_conversion_queue')" || fail restored-queue-count
          restored_queue_sha="$(docker exec "$restore_name" psql -X -U maxibot -d maxibot_restore_probe -At -v ON_ERROR_STOP=1 -c "COPY (SELECT row_to_json(q)::text FROM offline_conversion_queue q ORDER BY id) TO STDOUT" | sha256sum | awk '{print $1}')" || fail restored-queue-checksum
          preserved_counts() {
            local container="$1" database="$2" table rows
            for table in "${preserved_tables[@]}"; do
              rows="$(docker exec "$container" psql -X -U maxibot -d "$database" -At -v ON_ERROR_STOP=1 -c "select count(*) from public.\"$table\"")" || return 1
              [[ "$rows" =~ ^[0-9]+$ ]] || return 1
              printf '%s|%s\n' "$table" "$rows"
            done
          }
          restored_preserved_counts="$(preserved_counts "$restore_name" maxibot_restore_probe)" || fail preserved-restore-counts
          [[ "$source_preserved_counts" == "$restored_preserved_counts" ]] || fail preserved-table-restore-mismatch
          restored_head="$(docker exec "$restore_name" psql -X -U maxibot -d maxibot_restore_probe -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')" || fail restored-head-read
          # RESTORE_VERIFICATION_BLOCK_BEGIN
          restore_mismatch=0
          [[ "$source_tables" == "$restored_tables" ]] || { echo 'MIGRATION_RESTORE_COMPARE=FAIL:table_inventory' >&2; restore_mismatch=1; }
          [[ "$source_ext" == "$restored_ext" ]] || { echo 'MIGRATION_RESTORE_COMPARE=FAIL:extensions' >&2; restore_mismatch=1; }
          [[ "$source_rows" == "$restored_rows" ]] || { echo 'MIGRATION_RESTORE_COMPARE=FAIL:queue_row_count' >&2; restore_mismatch=1; }
          [[ "$source_queue_sha" == "$restored_queue_sha" ]] || { echo 'MIGRATION_RESTORE_COMPARE=FAIL:queue_checksum' >&2; restore_mismatch=1; }
          [[ "$restored_head" == "$expected_db_head" ]] || { echo 'MIGRATION_RESTORE_COMPARE=FAIL:alembic_head' >&2; restore_mismatch=1; }
          (( restore_mismatch == 0 )) || fail restore-verification-mismatch
          # RESTORE_VERIFICATION_BLOCK_END
          backup_sha="$(sha256sum "$backup" | awk '{print $1}')"
          preserved_counts_b64="$(printf '%s' "$source_preserved_counts" | base64 -w0)"
          printf '%s|%s|%s|%s|%s\n' "$backup" "$backup_sha" "$source_rows" "$source_queue_sha" "$preserved_counts_b64"
          REMOTE
          )"
          IFS='|' read -r backup_path backup_sha backup_queue_rows backup_queue_sha backup_preserved_counts <<< "$remote"
          [[ "$backup_sha" =~ ^[0-9a-f]{64}$ && "$backup_queue_rows" =~ ^[0-9]+$ && "$backup_queue_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "backup_sha=$backup_sha"
            echo "backup_path=$backup_path"
            echo "backup_queue_rows=$backup_queue_rows"
            echo "backup_queue_sha=$backup_queue_sha"
            echo "backup_preserved_counts=$backup_preserved_counts"
          } >> "$GITHUB_OUTPUT"
          printf 'Migration backup, archive validation and isolated restore: PASS; queue rows=%s, queue SHA256=%s, backup SHA256=%s\n' "$backup_queue_rows" "$backup_queue_sha" "$backup_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply or forward-resume the exact contract target from the immutable candidate image
        if: steps.baseline.outputs.migration_required == 'true'
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_PATH: ${{ steps.migration_backup.outputs.backup_path }}
          BACKUP_SHA: ${{ steps.migration_backup.outputs.backup_sha }}
          BACKUP_QUEUE_ROWS: ${{ steps.migration_backup.outputs.backup_queue_rows }}
          BACKUP_QUEUE_SHA: ${{ steps.migration_backup.outputs.backup_queue_sha }}
          BACKUP_PRESERVED_COUNTS: ${{ steps.migration_backup.outputs.backup_preserved_counts }}
          EXPECTED_DB_ID: ${{ steps.baseline.outputs.old_db_id }}
          EXPECTED_DB_VOLUME: ${{ steps.baseline.outputs.old_db_volume }}
          EXPECTED_PRODUCTION_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          EXPECTED_DATABASE_HEAD: ${{ steps.baseline.outputs.database_head }}
          MIGRATION_SOURCE: ${{ steps.baseline.outputs.migration_source }}
          MIGRATION_TARGET: ${{ steps.baseline.outputs.migration_target }}
          MIGRATION_RESUME: ${{ steps.baseline.outputs.migration_resume }}
          MIGRATION_CONTRACT_JSON: ${{ steps.baseline.outputs.migration_contract }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/akhripunov/maxibot-vps-api@sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKUP_PATH" == /opt/maxibot/backups/maxibot-db-migration-$GITHUB_RUN_ID.dump ]]
          [[ "$BACKUP_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BACKUP_QUEUE_ROWS" =~ ^[0-9]+$ ]]
          [[ "$BACKUP_QUEUE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BACKUP_PRESERVED_COUNTS" =~ ^[A-Za-z0-9+/=]+$ ]]
          [[ "$EXPECTED_DB_ID" =~ ^[0-9a-f]{64}$ && -n "$EXPECTED_DB_VOLUME" ]]
          [[ "$EXPECTED_PRODUCTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MIGRATION_SOURCE" =~ ^[A-Za-z0-9_]{1,64}$ && "$MIGRATION_TARGET" =~ ^[A-Za-z0-9_]{1,64}$ ]]
          [[ "$EXPECTED_DATABASE_HEAD" == "$MIGRATION_SOURCE" || "$EXPECTED_DATABASE_HEAD" == "$MIGRATION_TARGET" ]]
          [[ "$MIGRATION_RESUME" == true || "$MIGRATION_RESUME" == false ]]
          schema_contract_b64="$(jq -c '.schema' <<< "$MIGRATION_CONTRACT_JSON" | base64 -w0)"
          schema_query_b64="$(python scripts/verify_migration_schema_contract.py --print-query | base64 -w0)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          for run_status in queued in_progress; do
            active_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$run_status&per_page=100")"
            jq -e --arg current "$GITHUB_RUN_ID" 'all(.workflow_runs[]; (.id | tostring) == $current or .head_branch != "main" or .event != "push" or ((.name | test("release|deploy|cutover|kamal";"i")) | not))' <<< "$active_runs" >/dev/null || { echo 'competing production release detected immediately before migration' >&2; exit 1; }
          done
          remote_script="$RUNNER_TEMP/maxibot-migration-apply.sh"
          cat > "$remote_script" <<'REMOTE'
          set -euo pipefail
          fail() { echo "MIGRATION_APPLY=FAIL:$1" >&2; exit 1; }
          read -r registry_token
          docker_config="$(mktemp -d)"
          trap 'rm -rf -- "$docker_config"; rm -f -- "$0"' EXIT
          export DOCKER_CONFIG="$docker_config"
          printf '%s\n' "$registry_token" | docker login ghcr.io --username akhripunov --password-stdin >/dev/null
          unset registry_token
          sha="$1"; image_ref="$2"; expected_rows="$3"; expected_queue_sha="$4"; expected_backup="$5"; backup_sha="$6"; expected_db_id="$7"; expected_db_volume="$8"; expected_prod_sha="$9"; expected_db_head="${10}"; migration_resume="${11}"; migration_source="${12}"; migration_target="${13}"; expected_preserved_counts_b64="${14}"; schema_query_b64="${15}"
          schema_query="$(printf '%s' "$schema_query_b64" | base64 -d)" || fail 'schema query decode failed'
          db=maxibot-vps-db-1
          api="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=api)"
          worker="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker)"
          [[ "$api" =~ ^[0-9a-f]{64}$ && "$worker" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(docker inspect "$db" --format '{{.Id}}')" == "$expected_db_id" ]]
          [[ "$(docker inspect "$db" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')" == "$expected_db_volume" ]]
          [[ -s "$expected_backup" ]]
          [[ "$(sha256sum "$expected_backup" | awk '{print $1}')" == "$backup_sha" ]]
          docker exec -i "$db" pg_restore --list < "$expected_backup" >/dev/null
          api_sha="$(docker exec "$api" python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready",timeout=5))["commit_sha"])')"
          worker_sha="$(docker inspect "$worker" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MAXIBOT_COMMIT_SHA=//p')"
          [[ "$api_sha" == "$expected_prod_sha" && "$worker_sha" == "$expected_prod_sha" ]]
          [[ "$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')" == "$expected_db_head" ]]
          [[ "$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select count(*) from offline_conversion_queue')" == "$expected_rows" ]]
          queue_sha="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "COPY (SELECT row_to_json(q)::text FROM offline_conversion_queue q ORDER BY id) TO STDOUT" | sha256sum | awk '{print $1}')"
          [[ "$queue_sha" == "$expected_queue_sha" ]]
          preserved_counts_from_contract="$(printf '%s' "$expected_preserved_counts_b64" | base64 -d)" || fail 'preserved table evidence cannot be decoded'
          preserved_table_list="$(awk -F'|' 'NF == 2 {print $1}' <<< "$preserved_counts_from_contract")"
          [[ -n "$preserved_table_list" && "$(awk -F'|' 'NF != 2 {bad=1} END {print bad+0}' <<< "$preserved_counts_from_contract")" == 0 ]]
          preserved_counts() {
            local table rows
            while IFS= read -r table; do
              [[ "$table" =~ ^[a-z_][a-z0-9_]*$ ]] || return 1
              rows="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "select count(*) from public.\"$table\"")" || return 1
              [[ "$rows" =~ ^[0-9]+$ ]] || return 1
              printf '%s|%s\n' "$table" "$rows"
            done <<< "$preserved_table_list"
          }
          [[ "$(preserved_counts)" == "$preserved_counts_from_contract" ]] || fail 'preserved-table baseline differs from the verified backup'
          docker pull "$image_ref" >/dev/null
          test "$(docker image inspect "$image_ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$sha"
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker image inspect "$image_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fxq "$image_ref"
          if [[ "$migration_resume" == false ]]; then
            [[ "$expected_db_head" == "$migration_source" ]]
            docker run --rm --network kamal --env-file /opt/maxibot/.env --env-file /opt/maxibot/secrets/mail_cloud.env \
              -e MAX_RUN_POLLING=false "$image_ref" alembic upgrade "$migration_target"
          else
            [[ "$expected_db_head" == "$migration_target" ]]
          fi
          [[ "$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')" == "$migration_target" ]]
          [[ "$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select count(*) from offline_conversion_queue')" == "$expected_rows" ]]
          queue_sha_after="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "COPY (SELECT row_to_json(q)::text FROM offline_conversion_queue q ORDER BY id) TO STDOUT" | sha256sum | awk '{print $1}')"
          [[ "$queue_sha_after" == "$expected_queue_sha" ]]
          [[ "$(preserved_counts)" == "$preserved_counts_from_contract" ]] || fail 'preserved-table row counts changed during migration'
          schema_snapshot="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "$schema_query")" || fail 'post-migration PostgreSQL schema catalog snapshot failed'
          [[ -n "$schema_snapshot" ]] || fail 'post-migration schema catalog snapshot is empty'
          printf 'MIGRATION_SCHEMA_SNAPSHOT_B64=%s\n' "$(printf '%s' "$schema_snapshot" | base64 | tr -d '\n')"
          REMOTE
          chmod 700 "$remote_script"
          scp -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "$remote_script" "root@$PRODUCTION_HOST:/tmp/maxibot-migration-apply-$GITHUB_RUN_ID.sh"
          remote_output="$(printf '%s\n' "$KAMAL_REGISTRY_PASSWORD" | ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "bash /tmp/maxibot-migration-apply-$GITHUB_RUN_ID.sh '$CANDIDATE_SHA' '$IMAGE_REF' '$BACKUP_QUEUE_ROWS' '$BACKUP_QUEUE_SHA' '$BACKUP_PATH' '$BACKUP_SHA' '$EXPECTED_DB_ID' '$EXPECTED_DB_VOLUME' '$EXPECTED_PRODUCTION_SHA' '$EXPECTED_DATABASE_HEAD' '$MIGRATION_RESUME' '$MIGRATION_SOURCE' '$MIGRATION_TARGET' '$BACKUP_PRESERVED_COUNTS' '$schema_query_b64'")"
          rm -f "$remote_script"
          schema_snapshot_b64="$(sed -n 's/^MIGRATION_SCHEMA_SNAPSHOT_B64=//p' <<< "$remote_output" | tail -n 1)"
          [[ "$schema_snapshot_b64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo 'post-migration schema snapshot readback is missing' >&2; exit 1; }
          printf '%s' "$schema_snapshot_b64" | base64 -d | python scripts/verify_migration_schema_contract.py --contract-b64 "$schema_contract_b64" --snapshot-stdin --mode target
          echo "MIGRATION_APPLY=PASS TARGET=$MIGRATION_TARGET" >> "$GITHUB_STEP_SUMMARY"
      - name: Record exact application Deployment after all preflight gates
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$CANDIDATE_SHA" --arg digest "$IMAGE_REF" --arg operation "$RELEASE_OPERATION" --arg workflow_sha "$GITHUB_SHA" --arg build "$BUILD_RUN_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{image:$digest,operation:$operation,workflow_sha:$workflow_sha,build_run_id:$build}}' > "$RUNNER_TEMP/deployment.json"
          deployment_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/deployment.json" --jq .id)"
          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" -f state=in_progress -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Deploy application with Kamal
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" 'docker network inspect kamal >/dev/null'
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            bundle exec kamal rollback "$IMAGE_VERSION" --roles api
          else
            bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api
          fi
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/live >/dev/null
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          for host in maxibot.pro www.maxibot.pro api.maxibot.pro go.maxibot.pro admin.maxibot.pro; do
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 --resolve "$host:443:$PRODUCTION_HOST" "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            redirect="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' --resolve "$host:80:$PRODUCTION_HOST" "http://$host/health/ready")"
            [[ "$redirect" == https://* ]]
          done
          admin_headers="$RUNNER_TEMP/maxibot-admin-headers.txt"
          curl --silent --show-error --fail --resolve "admin.maxibot.pro:443:$PRODUCTION_HOST" --dump-header "$admin_headers" https://admin.maxibot.pro/ -o "$RUNNER_TEMP/maxibot-admin.html"
          grep -qi '^content-security-policy:' "$admin_headers"
          grep -qi '^strict-transport-security:' "$admin_headers"
          grep -qi '^x-frame-options: DENY' "$admin_headers"
          grep -qi '^x-content-type-options: nosniff' "$admin_headers"
          grep -qi '^referrer-policy: no-referrer' "$admin_headers"
          grep -qi '^cache-control: no-store' "$admin_headers"
          grep -q 'OWNER CONSOLE' "$RUNNER_TEMP/maxibot-admin.html"
      - name: Stop the existing Kamal Worker before starting its replacement
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal app stop --roles worker
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          ids="$(docker ps -q)"
          if [[ -n "$ids" ]]; then
            docker inspect $ids | python3 -c 'import json,sys; xs=json.load(sys.stdin); ps=[x["Id"] for x in xs if "MAX_RUN_POLLING=true" in x["Config"].get("Env",[])]; assert not ps, ps'
          fi
          REMOTE
      - name: Deploy the sole Worker with Kamal
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            bundle exec kamal rollback "$IMAGE_VERSION" --roles worker
          else
            bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles worker
          fi
      - name: Verify runtime, network connectivity, and Worker heartbeat
        env:
          EXPECTED_DATABASE_HEAD: ${{ steps.baseline.outputs.expected_database_head }}
          EXPECTED_DB_ID: ${{ steps.baseline.outputs.old_db_id }}
          EXPECTED_REDIS_ID: ${{ steps.baseline.outputs.old_redis_id }}
          EXPECTED_DB_VOLUME: ${{ steps.baseline.outputs.old_db_volume }}
          EXPECTED_REDIS_VOLUME: ${{ steps.baseline.outputs.old_redis_volume }}
          EXPECTED_UPLOADS_VOLUME: ${{ steps.baseline.outputs.old_uploads_volume }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s -- "$CANDIDATE_SHA" "$IMAGE_VERSION" "$IMAGE_REF" "$EXPECTED_DATABASE_HEAD" "$EXPECTED_DB_ID" "$EXPECTED_REDIS_ID" "$EXPECTED_DB_VOLUME" "$EXPECTED_REDIS_VOLUME" "$EXPECTED_UPLOADS_VOLUME" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; image_ref="$3"; expected_db_head="$4"
          expected_db_id="$5"; expected_redis_id="$6"
          expected_db_volume="$7"; expected_redis_volume="$8"; expected_uploads_volume="$9"
          api="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=api)"
          worker="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker)"
          [[ "$api" =~ ^[0-9a-f]{64}$ && "$worker" =~ ^[0-9a-f]{64}$ ]]
          python3 - "$api" "$worker" "$sha" "$version" "$image_ref" "$expected_db_head" "$expected_db_id" "$expected_redis_id" "$expected_db_volume" "$expected_redis_volume" "$expected_uploads_volume" <<'PY'
          import json, subprocess, sys
          api, worker, sha, version, image_ref, expected_db_head, expected_db_id, expected_redis_id, expected_db_volume, expected_redis_volume, expected_uploads_volume = sys.argv[1:]
          items = json.loads(subprocess.check_output(["docker", "inspect", api, worker], text=True))
          by_id = {item["Id"]: item for item in items}
          for cid, required_networks, polling in ((api, {"kamal"}, "false"), (worker, {"kamal"}, "true")):
              c = by_id[cid]
              assert c["State"]["Running"]
              assert c["Config"]["Image"] == f"ghcr.io/akhripunov/maxibot-vps-api:{version}"
              assert c["Config"]["Labels"]["org.opencontainers.image.revision"] == sha
              assert required_networks <= set(c["NetworkSettings"]["Networks"])
              env = dict(x.split("=",1) for x in c["Config"]["Env"] if "=" in x)
              assert env.get("MAX_RUN_POLLING") == polling
              image = json.loads(subprocess.check_output(["docker","image","inspect",c["Image"]],text=True))[0]
              assert image_ref in image.get("RepoDigests",[])
          for name in ("maxibot-vps-db-1","maxibot-vps-redis-1"):
              c=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert {"maxibot-vps-internal","kamal"} <= set(c["NetworkSettings"]["Networks"])
              alias = "db" if name.endswith("db-1") else "redis"
              assert alias in c["NetworkSettings"]["Networks"]["kamal"]["Aliases"]
              assert c["Id"] == (expected_db_id if alias == "db" else expected_redis_id)
              destination = "/var/lib/postgresql/data" if alias == "db" else "/data"
              volume = next(m["Name"] for m in c["Mounts"] if m["Destination"] == destination)
              assert volume == (expected_db_volume if alias == "db" else expected_redis_volume)
          proxy=json.loads(subprocess.check_output(["docker","inspect","kamal-proxy"],text=True))[0]
          assert proxy["State"]["Running"] is True
          ports=proxy["NetworkSettings"]["Ports"]
          assert ports["80/tcp"] and ports["443/tcp"]
          for name in ("maxibot-vps-api-1", "maxibot-vps-worker-1"):
              old=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert not old["State"]["Running"], (name, old["State"])
          uploads=next(m["Name"] for m in by_id[api]["Mounts"] if m["Destination"] == "/app/uploads")
          assert uploads == expected_uploads_volume
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]]"],check=True)
          ids=subprocess.check_output(["docker","ps","-q"],text=True).split()
          allc=json.loads(subprocess.check_output(["docker","inspect",*ids],text=True)) if ids else []
          pollers=[c["Id"] for c in allc if "MAX_RUN_POLLING=true" in c["Config"].get("Env",[])]
          assert pollers == [worker], pollers
          assert by_id[worker]["HostConfig"]["Memory"] == 536870912
          assert subprocess.check_output(["docker","exec",worker,"cat","/sys/fs/cgroup/memory.max"],text=True).strip() == "536870912"
          db_head=subprocess.check_output(["docker","exec","maxibot-vps-db-1","psql","-X","-U","maxibot","-d","maxibot","-At","-v","ON_ERROR_STOP=1","-c","select version_num from alembic_version"],text=True).strip()
          assert db_head == expected_db_head
          for name, cmd in (("maxibot-vps-db-1",["pg_isready","-U","maxibot","-d","maxibot"]),("maxibot-vps-redis-1",["redis-cli","ping"])):
              subprocess.run(["docker","exec",name,*cmd],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]]"],check=True)
          PY
          REMOTE
          cat app/worker_health.py scripts/worker_health_preflight.py > "$RUNNER_TEMP/maxibot-worker-health.py"
          scp -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "$RUNNER_TEMP/maxibot-worker-health.py" "root@$PRODUCTION_HOST:/tmp/maxibot-worker-health-$GITHUB_RUN_ID.py"
          worker_id="$(ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker")"
          [[ "$worker_id" =~ ^[0-9a-f]{64}$ ]]
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "python3 /tmp/maxibot-worker-health-$GITHUB_RUN_ID.py --container '$worker_id' --interval 60 --max-age 90 --expected-release '$CANDIDATE_SHA'"
          echo 'MAXIBOT_KAMAL_DEPLOY_VERIFY=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the actual verified application result
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[0-9]+$ ]]
          state=failure
          if [[ "$JOB_RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=production -f environment_url=https://api.maxibot.pro \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$RELEASE_OPERATION $CANDIDATE_SHA runtime Verify: $JOB_RESULT" >/dev/null

