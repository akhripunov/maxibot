name: MAXIBOT — Native First V3 + Kamal 2
on:
  push:
    branches:
      - codex/native-release-maxibot
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit production rollback only; normal deploys follow successful main push CI and Build
        required: true
        type: choice
        default: rollback
        options:
          - rollback
      candidate:
        description: Exact SHA of the previous successful production version to restore
        required: true
        type: string
      build_run_id:
        description: Run ID of the successful main Build for the rollback image
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest reported by that rollback Build
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: maxibot-production-release
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
      BUNDLE_GEMFILE: Gemfile.kamal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$GITHUB_BASE_REF" = main
            test "$CANDIDATE_SHA" = "$GITHUB_HEAD_REF_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install existing test dependencies
        run: |
          python - <<'DEPS' > "$RUNNER_TEMP/test-requirements.txt"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          print('\n'.join(project['dependencies'] + project['optional-dependencies']['test']))
          DEPS
          python -m pip install --no-cache-dir pip==26.2.2
          python -m pip install -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Run the complete exact-candidate MAXIBOT suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Load Kamal config with synthetic registry secret
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          synthetic_registry_secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$synthetic_registry_secret" > .kamal/secrets
          unset synthetic_registry_secret
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          test "$(stat -c '%a' .kamal/secrets)" = 600
          bundle exec ruby -e 'abort unless Gem.loaded_specs.fetch("kamal").version.to_s == "2.12.0"'
          bundle exec kamal config >/dev/null
          bundle exec ruby -rkamal -e 'abort unless Kamal::Cli::Main.class_options.keys.map(&:to_s).include?("roles"); abort unless Kamal::Cli::Main.all_commands.key?("rollback")'
          python - <<'PY'
          import yaml
          with open('config/deploy.yml', encoding='utf-8') as stream:
              config = yaml.safe_load(stream)
          assert set(config['proxy']['hosts']) == {
              'maxibot.pro', 'www.maxibot.pro', 'api.maxibot.pro',
              'go.maxibot.pro', 'admin.maxibot.pro',
          }
          assert config['proxy']['ssl'] is True
          assert config['proxy']['app_port'] == 8000
          assert config['proxy']['healthcheck']['path'] == '/health/ready'
          assert set(config['servers']) == {'api', 'worker'}
          assert config['servers']['api'].get('proxy', True) is not False
          assert config['servers']['worker']['proxy'] is False
          PY
          rm -f .kamal/secrets
          test ! -e .kamal/secrets
  build:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: tests
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      image_version: ${{ steps.version.outputs.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set the immutable run-scoped image version
        id: version
        run: echo "value=$CANDIDATE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build once and push directly to GHCR
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=min
          tags: ghcr.io/akhripunov/maxibot-vps-api:${{ steps.version.outputs.value }}
          labels: |
            service=maxibot
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source-sha=${{ env.CANDIDATE_SHA }}
            org.maxibot.release.sha=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source=https://github.com/akhripunov/maxibot
            org.opencontainers.image.url=https://github.com/akhripunov/maxibot/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=maxibot-native
          cache-to: type=gha,scope=maxibot-native,mode=max
      - name: Record the immutable build output in the native run summary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/akhripunov/maxibot-vps-api@$IMAGE_DIGEST"
          manifest="$(docker buildx imagetools inspect "$IMAGE")"
          grep -Eq "^Digest:[[:space:]]+$IMAGE_DIGEST$" <<< "$manifest"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          echo "MAXIBOT_BUILD_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "MAXIBOT_BUILD_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "MAXIBOT_BUILD_SHA=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'NATIVE_RELEASE_BUILD: `%s` → `%s`\n' "$CANDIDATE_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'MAXIBOT_GHCR_DIGEST_PLATFORM=PASS' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.result == 'success' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.operation == 'rollback')
      )
    needs:
      - tests
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      deployment: false
    permissions:
      actions: read
      contents: read
      packages: read
      deployments: write
    env:
      RELEASE_OPERATION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'deploy' || inputs.operation || '' }}
      BUILD_RUN_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || inputs.build_run_id }}
      BUILD_IMAGE_VERSION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.image_version || '' }}
      PRODUCTION_HOST: 135.106.166.46
      BUNDLE_GEMFILE: Gemfile.kamal
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select and verify the exact-SHA build image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_DIGEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.image_digest || inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_OPERATION" == deploy || "$RELEASE_OPERATION" == rollback ]]
          if [[ "$RELEASE_OPERATION" == deploy ]]; then test "$CANDIDATE_SHA" = "$GITHUB_SHA"; fi
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          build_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          if [[ "$RELEASE_OPERATION" == deploy ]]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$BUILD_RUN_ID" = "$GITHUB_RUN_ID"
            build_attempt="${BUILD_IMAGE_VERSION##*-}"
            [[ "$build_attempt" =~ ^[1-9][0-9]*$ ]]
            test "$BUILD_IMAGE_VERSION" = "$CANDIDATE_SHA-$BUILD_RUN_ID-$build_attempt"
            jq -e --arg sha "$CANDIDATE_SHA" --arg attempt "$build_attempt" \
              '.head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .run_attempt >= ($attempt | tonumber)
                and .path == ".github/workflows/maxibot-native-release.yml"
                and .status == "in_progress"' <<< "$build_run" >/dev/null
          else
            jq -e --arg sha "$CANDIDATE_SHA" \
              '.head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
                and .path == ".github/workflows/maxibot-native-release.yml"' \
              <<< "$build_run" >/dev/null
            build_attempt="$(jq -r .run_attempt <<< "$build_run")"
          fi
          [[ "$build_attempt" =~ ^[0-9]+$ ]]
          image_version="$CANDIDATE_SHA-$BUILD_RUN_ID-$build_attempt"
          image_tag="ghcr.io/akhripunov/maxibot-vps-api:$image_version"
          manifest="$(docker buildx imagetools inspect "$image_tag")"
          image_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$manifest")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$image_digest" = "$APPROVED_DIGEST"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          image_ref="ghcr.io/akhripunov/maxibot-vps-api@$image_digest"
          docker pull "$image_ref" >/dev/null
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          for label in org.opencontainers.image.revision org.opencontainers.image.source-sha org.maxibot.release.sha; do
            test "$(docker image inspect "$image_ref" --format "{{index .Config.Labels \"$label\"}}")" = "$CANDIDATE_SHA"
          done
          service_label="$(docker image inspect "$image_ref" --format '{{index .Config.Labels "service"}}')"
          test "$service_label" = maxibot
          {
            echo "image_version=$image_version"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_ref"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_VERSION=$image_version"
            echo "IMAGE_TAG=$image_tag"
            echo "IMAGE_REF=$image_ref"
          } >> "$GITHUB_ENV"
          printf 'BUILD_RUN=%s (attempt %s)\nIMAGE_TAG=`%s`\nIMMUTABLE_IMAGE=`%s`\n' \
            "$BUILD_RUN_ID" "$build_attempt" "$image_tag" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Verify exact main and read the current production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SSH_KEY: ${{ secrets.MAXIBOT_PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.MAXIBOT_PRODUCTION_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { printf 'PRODUCTION_BASELINE=FAIL: %s\n' "$1" >&2; exit 1; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'candidate SHA is malformed'
          [[ "$IMAGE_REF" =~ ^ghcr\.io/akhripunov/maxibot-vps-api@sha256:[0-9a-f]{64}$ ]] || fail 'image reference is not an immutable GHCR digest'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || fail 'checkout does not match workflow SHA'
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" || fail 'GitHub main read failed'
          test "$main_sha" = "$GITHUB_SHA" || fail 'GitHub main no longer matches workflow SHA'
          test "$PRODUCTION_HOST" = 135.106.166.46 || fail 'production host does not match MAXIBOT VPS'
          test -n "$PRODUCTION_SSH_KEY" && test -n "$PRODUCTION_KNOWN_HOSTS" || fail 'production SSH credentials are not configured'
          install -d -m 700 "$RUNNER_TEMP/ssh" "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          install -m 600 "$RUNNER_TEMP/ssh/id_ed25519" "$HOME/.ssh/id_ed25519"
          cat "$RUNNER_TEMP/ssh/known_hosts" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host $PRODUCTION_HOST
            HostName $PRODUCTION_HOST
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
          echo "PRODUCTION_SSH=$RUNNER_TEMP/ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "PRODUCTION_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"
          remote="$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          fail() { printf 'PRODUCTION_BASELINE=FAIL: %s\n' "$1" >&2; exit 1; }
          require_running() {
            local name="$1" state
            state="$(docker inspect "$name" --format '{{.State.Running}}' 2>/dev/null)" || fail "cannot inspect required container $name"
            [[ "$state" == true ]] || fail "required container $name is not running"
          }
          db=maxibot-vps-db-1
          redis=maxibot-vps-redis-1
          require_running "$db"
          require_running "$redis"
          docker exec "$db" pg_isready -U maxibot -d maxibot >/dev/null 2>&1 || fail 'PostgreSQL is not accepting connections'
          redis_ping="$(docker exec "$redis" redis-cli ping 2>/dev/null)" || fail 'Redis PING command failed'
          [[ "$redis_ping" == PONG ]] || fail 'Redis did not return PONG'

          api="$(docker ps --no-trunc -q --filter label=service=maxibot --filter label=role=api)" || fail 'Docker API query for Kamal API failed'
          worker="$(docker ps --no-trunc -q --filter label=service=maxibot --filter label=role=worker)" || fail 'Docker API query for Kamal Worker failed'
          [[ "$api" =~ ^[0-9a-f]{64}$ ]] || fail 'expected exactly one running Kamal API container'
          [[ "$worker" =~ ^[0-9a-f]{64}$ ]] || fail 'expected exactly one running Kamal Worker container'
          require_running "$api"
          require_running "$worker"
          api_sha="$(docker exec "$api" python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready",timeout=5))["commit_sha"])' 2>/dev/null)" || fail 'API readiness endpoint failed'
          [[ "$api_sha" =~ ^[0-9a-f]{40}$ ]] || fail 'API readiness returned an invalid source SHA'
          worker_sha="$(docker inspect "$worker" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MAXIBOT_COMMIT_SHA=//p')" || fail 'Worker source SHA inspection failed'
          [[ "$api_sha" == "$worker_sha" ]] || fail 'API and Worker source SHAs do not match'
          database_head="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')" || fail 'PostgreSQL Alembic head query failed'
          [[ "$database_head" =~ ^[A-Za-z0-9_]+$ ]] || fail 'PostgreSQL Alembic head is empty or malformed'
          db_id="$(docker inspect "$db" --format '{{.Id}}')" || fail 'PostgreSQL container identity read failed'
          redis_id="$(docker inspect "$redis" --format '{{.Id}}')" || fail 'Redis container identity read failed'
          db_volume="$(docker inspect "$db" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')" || fail 'PostgreSQL volume read failed'
          redis_volume="$(docker inspect "$redis" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" || fail 'Redis volume read failed'
          uploads_volume="$(docker inspect "$api" --format '{{range .Mounts}}{{if eq .Destination "/app/uploads"}}{{.Name}}{{end}}{{end}}')" || fail 'API uploads volume read failed'
          [[ "$db_id" =~ ^[0-9a-f]{64}$ && "$redis_id" =~ ^[0-9a-f]{64}$ ]] || fail 'PostgreSQL or Redis container identity is malformed'
          [[ -n "$db_volume" && -n "$redis_volume" && -n "$uploads_volume" ]] || fail 'required PostgreSQL, Redis, or uploads volume is missing'
          printf '%s|%s|%s|%s|%s|%s|%s\n' "$api_sha" "$database_head" "$db_id" "$redis_id" "$db_volume" "$redis_volume" "$uploads_volume"
          REMOTE
          )" || fail 'SSH could not read the production runtime baseline'
          IFS='|' read -r baseline_sha database_head old_db_id old_redis_id old_db_volume old_redis_volume old_uploads_volume <<< "$remote"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]] || fail 'production baseline SHA is missing or malformed'
          [[ "$database_head" =~ ^[A-Za-z0-9_]+$ ]] || fail 'production database head is missing or malformed'
          [[ "$old_db_id" =~ ^[0-9a-f]{64}$ && "$old_redis_id" =~ ^[0-9a-f]{64}$ ]] || fail 'production data-container identity is missing or malformed'
          [[ -n "$old_db_volume" && -n "$old_redis_volume" && -n "$old_uploads_volume" ]] || fail 'production data volume identity is missing'
          git cat-file -e "$baseline_sha^{commit}" || fail 'production baseline SHA is not present in the checked-out Git history'
          # ROLLBACK_DEPLOYMENT_GATE_BEGIN
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            previous_success=
            deployments="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=100")"
            while IFS='|' read -r deployment_id deployed_sha; do
              [[ "$deployment_id" =~ ^[0-9]+$ && "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$deployed_sha" == "$baseline_sha" ]] && continue
              statuses="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100")"
              if jq -e 'any(.[]; .state == "success")' <<< "$statuses" >/dev/null; then
                test "$deployed_sha" = "$CANDIDATE_SHA"
                previous_success="$deployment_id"
                break
              fi
            done < <(jq -r '.[] | [.id,.sha] | join("|")' <<< "$deployments")
            test -n "$previous_success"
            echo 'ROLLBACK_PREVIOUS_SUCCESS=PASS'
          fi
          # ROLLBACK_DEPLOYMENT_GATE_END
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            test "$baseline_sha" != "$CANDIDATE_SHA"
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$baseline_sha"
            git diff --quiet "$CANDIDATE_SHA" "$baseline_sha" -- app alembic config .kamal Dockerfile Gemfile.kamal Gemfile.kamal.lock pyproject.toml
            git diff --quiet "$CANDIDATE_SHA" "$GITHUB_SHA" -- app alembic config .kamal Dockerfile Gemfile.kamal Gemfile.kamal.lock pyproject.toml
          fi
          if ! git diff --quiet "$baseline_sha" "$CANDIDATE_SHA" -- alembic app/db/models.py docker-compose.vps.yml; then
            fail 'ordinary Kamal Deploy refuses database/model or production Compose changes'
          fi
          if ! git diff --quiet "$baseline_sha" "$CANDIDATE_SHA" -- docs/frozen_paths.yaml scripts/frozen_path_guard.sh; then
            fail 'ordinary Kamal Deploy refuses frozen-path policy or guard changes'
          fi
          bash scripts/frozen_path_guard.sh --base "$baseline_sha" --head "$CANDIDATE_SHA" || fail 'frozen-path guard rejected the candidate'
          echo 'PRODUCTION_BASELINE=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'FROZEN_PATH_REGRESSION=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "database_head=$database_head" >> "$GITHUB_OUTPUT"
          echo "old_db_id=$old_db_id" >> "$GITHUB_OUTPUT"
          echo "old_redis_id=$old_redis_id" >> "$GITHUB_OUTPUT"
          echo "old_db_volume=$old_db_volume" >> "$GITHUB_OUTPUT"
          echo "old_redis_volume=$old_redis_volume" >> "$GITHUB_OUTPUT"
          echo "old_uploads_volume=$old_uploads_volume" >> "$GITHUB_OUTPUT"
      - name: Verify exact GHCR image and Kamal configuration
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          api="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=api)"
          worker="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker)"
          [[ "$api" =~ ^[0-9a-f]{64}$ && "$worker" =~ ^[0-9a-f]{64}$ ]]
          python3 - "$api" "$worker" <<'PY'
          import json, subprocess, sys
          api, worker = sys.argv[1:]
          items = json.loads(subprocess.check_output(["docker", "inspect", api, worker], text=True))
          by_id = {item["Id"]: item for item in items}
          assert "kamal" in by_id[api]["NetworkSettings"]["Networks"]
          assert "kamal" in by_id[worker]["NetworkSettings"]["Networks"]
          proxy = json.loads(subprocess.check_output(["docker", "inspect", "kamal-proxy"], text=True))[0]
          assert proxy["State"]["Running"] is True
          for name, alias in (("maxibot-vps-db-1", "db"), ("maxibot-vps-redis-1", "redis")):
              c = json.loads(subprocess.check_output(["docker", "inspect", name], text=True))[0]
              assert {"maxibot-vps-internal", "kamal"} <= set(c["NetworkSettings"]["Networks"])
              assert alias in c["NetworkSettings"]["Networks"]["kamal"]["Aliases"]
          subprocess.run(["docker", "exec", api, "python", "-c", "import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]]"], check=True)
          env = dict(x.split("=",1) for x in by_id[api]["Config"]["Env"] if "=" in x)
          worker_env = dict(x.split("=",1) for x in by_id[worker]["Config"]["Env"] if "=" in x)
          assert env.get("MAX_RUN_POLLING") == "false"
          assert worker_env.get("MAX_RUN_POLLING") == "true"
          assert by_id[worker]["HostConfig"]["Memory"] == 536870912
          assert not by_id[worker]["State"]["OOMKilled"]
          ids = subprocess.check_output(["docker", "ps", "-q"], text=True).split()
          running = json.loads(subprocess.check_output(["docker", "inspect", *ids], text=True)) if ids else []
          pollers = [item["Id"] for item in running if "MAX_RUN_POLLING=true" in item["Config"].get("Env", [])]
          assert pollers == [worker], pollers
          PY
          REMOTE
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          [[ "$IMAGE_VERSION" =~ ^$CANDIDATE_SHA-[0-9]+-[0-9]+$ ]]
          approved_digest="$(printf '%s\n' "$IMAGE_REF" | cut -d@ -f2)"
          [[ "$approved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_readback="$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/ {print $2; exit}')"
          test "$digest_readback" = "$approved_digest"
          docker pull "$IMAGE_REF" >/dev/null
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          for label in org.opencontainers.image.revision org.opencontainers.image.source-sha org.maxibot.release.sha; do
            test "$(docker image inspect "$IMAGE_REF" --format "{{index .Config.Labels \"$label\"}}")" = "$CANDIDATE_SHA"
          done
          service_label="$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "service"}}')"
          test "$service_label" = maxibot
          export MAXIBOT_COMMIT_SHA="$CANDIDATE_SHA"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal config >/dev/null
          bundle exec kamal registry login
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" python3 - "$IMAGE_VERSION" "$IMAGE_REF" "$CANDIDATE_SHA" <<'PY'
          import json, subprocess, sys
          version, image_ref, sha = sys.argv[1:]
          for role in ("api", "worker"):
              name = f"maxibot-{role}-{version}"
              c = json.loads(subprocess.check_output(["docker", "inspect", name], text=True))[0]
              assert c["State"]["Running"] is False
              assert c["Config"]["Labels"]["service"] == "maxibot"
              assert c["Config"]["Labels"]["role"] == role
              assert c["Config"]["Labels"]["org.opencontainers.image.revision"] == sha
              image = json.loads(subprocess.check_output(["docker", "image", "inspect", c["Image"]], text=True))[0]
              assert image_ref in image.get("RepoDigests", [])
          print("ROLLBACK_RETAINED_IMAGE=PASS")
          PY
          fi
      - name: Record exact application Deployment after all preflight gates
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$CANDIDATE_SHA" --arg digest "$IMAGE_REF" --arg operation "$RELEASE_OPERATION" --arg workflow_sha "$GITHUB_SHA" --arg build "$BUILD_RUN_ID" \
            '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],payload:{image:$digest,operation:$operation,workflow_sha:$workflow_sha,build_run_id:$build}}' > "$RUNNER_TEMP/deployment.json"
          deployment_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/deployment.json" --jq .id)"
          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" -f state=in_progress -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Deploy application with Kamal
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" 'docker network inspect kamal >/dev/null'
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            bundle exec kamal rollback "$IMAGE_VERSION" --roles api
          else
            bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api
          fi
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/live >/dev/null
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          for host in maxibot.pro www.maxibot.pro api.maxibot.pro go.maxibot.pro admin.maxibot.pro; do
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 --resolve "$host:443:$PRODUCTION_HOST" "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            redirect="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' --resolve "$host:80:$PRODUCTION_HOST" "http://$host/health/ready")"
            [[ "$redirect" == https://* ]]
          done
          admin_headers="$RUNNER_TEMP/maxibot-admin-headers.txt"
          curl --silent --show-error --fail --resolve "admin.maxibot.pro:443:$PRODUCTION_HOST" --dump-header "$admin_headers" https://admin.maxibot.pro/ -o "$RUNNER_TEMP/maxibot-admin.html"
          grep -qi '^content-security-policy:' "$admin_headers"
          grep -qi '^strict-transport-security:' "$admin_headers"
          grep -qi '^x-frame-options: DENY' "$admin_headers"
          grep -qi '^x-content-type-options: nosniff' "$admin_headers"
          grep -qi '^referrer-policy: no-referrer' "$admin_headers"
          grep -qi '^cache-control: no-store' "$admin_headers"
          grep -q 'OWNER CONSOLE' "$RUNNER_TEMP/maxibot-admin.html"
      - name: Stop the existing Kamal Worker before starting its replacement
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal app stop --roles worker
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          ids="$(docker ps -q)"
          if [[ -n "$ids" ]]; then
            docker inspect $ids | python3 -c 'import json,sys; xs=json.load(sys.stdin); ps=[x["Id"] for x in xs if "MAX_RUN_POLLING=true" in x["Config"].get("Env",[])]; assert not ps, ps'
          fi
          REMOTE
      - name: Deploy the sole Worker with Kamal
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          if [[ "$RELEASE_OPERATION" == rollback ]]; then
            bundle exec kamal rollback "$IMAGE_VERSION" --roles worker
          else
            bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles worker
          fi
      - name: Verify runtime, network connectivity, and Worker heartbeat
        env:
          EXPECTED_DATABASE_HEAD: ${{ steps.baseline.outputs.database_head }}
          EXPECTED_DB_ID: ${{ steps.baseline.outputs.old_db_id }}
          EXPECTED_REDIS_ID: ${{ steps.baseline.outputs.old_redis_id }}
          EXPECTED_DB_VOLUME: ${{ steps.baseline.outputs.old_db_volume }}
          EXPECTED_REDIS_VOLUME: ${{ steps.baseline.outputs.old_redis_volume }}
          EXPECTED_UPLOADS_VOLUME: ${{ steps.baseline.outputs.old_uploads_volume }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s -- "$CANDIDATE_SHA" "$IMAGE_VERSION" "$IMAGE_REF" "$EXPECTED_DATABASE_HEAD" "$EXPECTED_DB_ID" "$EXPECTED_REDIS_ID" "$EXPECTED_DB_VOLUME" "$EXPECTED_REDIS_VOLUME" "$EXPECTED_UPLOADS_VOLUME" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; image_ref="$3"; expected_db_head="$4"
          expected_db_id="$5"; expected_redis_id="$6"
          expected_db_volume="$7"; expected_redis_volume="$8"; expected_uploads_volume="$9"
          api="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=api)"
          worker="$(docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker)"
          [[ "$api" =~ ^[0-9a-f]{64}$ && "$worker" =~ ^[0-9a-f]{64}$ ]]
          python3 - "$api" "$worker" "$sha" "$version" "$image_ref" "$expected_db_head" "$expected_db_id" "$expected_redis_id" "$expected_db_volume" "$expected_redis_volume" "$expected_uploads_volume" <<'PY'
          import json, subprocess, sys
          api, worker, sha, version, image_ref, expected_db_head, expected_db_id, expected_redis_id, expected_db_volume, expected_redis_volume, expected_uploads_volume = sys.argv[1:]
          items = json.loads(subprocess.check_output(["docker", "inspect", api, worker], text=True))
          by_id = {item["Id"]: item for item in items}
          for cid, required_networks, polling in ((api, {"kamal"}, "false"), (worker, {"kamal"}, "true")):
              c = by_id[cid]
              assert c["State"]["Running"]
              assert c["Config"]["Image"] == f"ghcr.io/akhripunov/maxibot-vps-api:{version}"
              assert c["Config"]["Labels"]["org.opencontainers.image.revision"] == sha
              assert required_networks <= set(c["NetworkSettings"]["Networks"])
              env = dict(x.split("=",1) for x in c["Config"]["Env"] if "=" in x)
              assert env.get("MAX_RUN_POLLING") == polling
              image = json.loads(subprocess.check_output(["docker","image","inspect",c["Image"]],text=True))[0]
              assert image_ref in image.get("RepoDigests",[])
          for name in ("maxibot-vps-db-1","maxibot-vps-redis-1"):
              c=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert {"maxibot-vps-internal","kamal"} <= set(c["NetworkSettings"]["Networks"])
              alias = "db" if name.endswith("db-1") else "redis"
              assert alias in c["NetworkSettings"]["Networks"]["kamal"]["Aliases"]
              assert c["Id"] == (expected_db_id if alias == "db" else expected_redis_id)
              destination = "/var/lib/postgresql/data" if alias == "db" else "/data"
              volume = next(m["Name"] for m in c["Mounts"] if m["Destination"] == destination)
              assert volume == (expected_db_volume if alias == "db" else expected_redis_volume)
          proxy=json.loads(subprocess.check_output(["docker","inspect","kamal-proxy"],text=True))[0]
          assert proxy["State"]["Running"] is True
          ports=proxy["NetworkSettings"]["Ports"]
          assert ports["80/tcp"] and ports["443/tcp"]
          for name in ("maxibot-vps-api-1", "maxibot-vps-worker-1"):
              old=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert not old["State"]["Running"], (name, old["State"])
          uploads=next(m["Name"] for m in by_id[api]["Mounts"] if m["Destination"] == "/app/uploads")
          assert uploads == expected_uploads_volume
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]]"],check=True)
          ids=subprocess.check_output(["docker","ps","-q"],text=True).split()
          allc=json.loads(subprocess.check_output(["docker","inspect",*ids],text=True)) if ids else []
          pollers=[c["Id"] for c in allc if "MAX_RUN_POLLING=true" in c["Config"].get("Env",[])]
          assert pollers == [worker], pollers
          assert by_id[worker]["HostConfig"]["Memory"] == 536870912
          assert subprocess.check_output(["docker","exec",worker,"cat","/sys/fs/cgroup/memory.max"],text=True).strip() == "536870912"
          db_head=subprocess.check_output(["docker","exec","maxibot-vps-db-1","psql","-X","-U","maxibot","-d","maxibot","-At","-v","ON_ERROR_STOP=1","-c","select version_num from alembic_version"],text=True).strip()
          assert db_head == expected_db_head
          for name, cmd in (("maxibot-vps-db-1",["pg_isready","-U","maxibot","-d","maxibot"]),("maxibot-vps-redis-1",["redis-cli","ping"])):
              subprocess.run(["docker","exec",name,*cmd],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]]"],check=True)
          PY
          REMOTE
          cat app/worker_health.py scripts/worker_health_preflight.py > "$RUNNER_TEMP/maxibot-worker-health.py"
          scp -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "$RUNNER_TEMP/maxibot-worker-health.py" "root@$PRODUCTION_HOST:/tmp/maxibot-worker-health-$GITHUB_RUN_ID.py"
          worker_id="$(ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "docker ps -q --no-trunc --filter label=service=maxibot --filter label=role=worker")"
          [[ "$worker_id" =~ ^[0-9a-f]{64}$ ]]
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "python3 /tmp/maxibot-worker-health-$GITHUB_RUN_ID.py --container '$worker_id' --interval 60 --max-age 90 --expected-release '$CANDIDATE_SHA'"
          echo 'MAXIBOT_KAMAL_DEPLOY_VERIFY=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the actual verified application result
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[0-9]+$ ]]
          state=failure
          if [[ "$JOB_RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=production -f environment_url=https://api.maxibot.pro \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$RELEASE_OPERATION $CANDIDATE_SHA runtime Verify: $JOB_RESULT" >/dev/null
