name: MAXIBOT — Native First V3 + Kamal 2
on:
  push:
    branches:
      - codex/native-release-maxibot
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit production rollback only; normal deploys follow successful main push CI and Build
        required: true
        type: choice
        default: rollback
        options:
          - rollback
      candidate:
        description: Exact SHA of the previous successful production version to restore
        required: true
        type: string
      build_run_id:
        description: Run ID of the successful main Build for the rollback image
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest reported by that rollback Build
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: maxibot-production-release
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maxibot_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maxibot_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: read
    env:
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
      BUNDLE_GEMFILE: Gemfile.kamal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$GITHUB_BASE_REF" = main
            test "$CANDIDATE_SHA" = "$GITHUB_HEAD_REF_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install existing test dependencies
        run: |
          python - <<'DEPS' > "$RUNNER_TEMP/test-requirements.txt"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          print('\n'.join(project['dependencies'] + project['optional-dependencies']['test']))
          DEPS
          python -m pip install --no-cache-dir pip==26.2.2
          python -m pip install -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Validate GitHub Actions workflows with pinned actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/maxibot-native-release.yml
      - name: Validate the migration risk contract and Alembic graph
        id: migration_contract
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="$(git merge-base "$CANDIDATE_SHA" "origin/$GITHUB_BASE_REF")"
          else
            base_sha="$GITHUB_EVENT_BEFORE"
          fi
          changed_paths="$(git diff --name-only "$base_sha" "$CANDIDATE_SHA")"
          if grep -Fxq 'docs/release/migration-risk-contract.json' <<< "$changed_paths"; then
            declared_source_sha="$(python -c 'import json; print(json.load(open("docs/release/migration-risk-contract.json"))["source_application_sha"])')"
            [[ "$declared_source_sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$declared_source_sha" "$CANDIDATE_SHA"
            base_sha="$declared_source_sha"
          fi
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          contract="$(python scripts/migration_release_contract.py --base-sha "$base_sha" --head-sha "$CANDIDATE_SHA" --database-head "$(python -c 'import json; print(json.load(open("docs/release/migration-risk-contract.json"))["source_revision"])')")"
          python - "$contract" "$base_sha" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          contract=json.loads(sys.argv[1])
          print(f"validation_base_sha={sys.argv[2]}")
          for name in ("migration_required", "migration_resume", "source_revision", "target_revision", "rehearsal_script", "task"):
              print(f"{name}={str(contract.get(name, '')).lower() if isinstance(contract.get(name), bool) else contract.get(name, '')}")
          print(f"frozen_paths={json.dumps(contract.get('frozen_paths', []), separators=(',', ':'))}")
          print(f"preserved_tables={json.dumps(contract.get('preserved_tables', []), separators=(',', ':'))}")
          PY
      - name: Run exact-candidate Frozen Path Guard
        env:
          MIGRATION_REQUIRED: ${{ steps.migration_contract.outputs.migration_required }}
          MIGRATION_TASK: ${{ steps.migration_contract.outputs.task }}
          MIGRATION_FROZEN_PATHS: ${{ steps.migration_contract.outputs.frozen_paths }}
          MIGRATION_VALIDATION_BASE_SHA: ${{ steps.migration_contract.outputs.validation_base_sha }}
        run: |
          set -euo pipefail
          base_sha="$MIGRATION_VALIDATION_BASE_SHA"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$MIGRATION_REQUIRED" == true ]]; then
            [[ -n "$MIGRATION_TASK" ]]
            mapfile -t frozen_paths < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["MIGRATION_FROZEN_PATHS"])))')
            [[ "${#frozen_paths[@]}" -gt 0 ]]
            guard_args=(--base "$base_sha" --head "$CANDIDATE_SHA" --owner-approved-task "$MIGRATION_TASK")
            for path in "${frozen_paths[@]}"; do guard_args+=(--owner-approved-path "$path"); done
            bash scripts/frozen_path_guard.sh "${guard_args[@]}"
          else
            bash scripts/frozen_path_guard.sh --base "$base_sha" --head "$CANDIDATE_SHA"
          fi
      - name: Rehearse the authorized migration on isolated PostgreSQL
        if: steps.migration_contract.outputs.migration_required == 'true'
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/maxibot_rehearsal
          REHEARSAL_SCRIPT: ${{ steps.migration_contract.outputs.rehearsal_script }}
        run: python "$REHEARSAL_SCRIPT"
      - name: Run the complete exact-candidate MAXIBOT suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - name: Run frozen attribution, security, data, and Worker regressions
        run: |
          python -m pytest -q \
            tests/regression/test_mobile_max_handoff_contract.py \
            tests/regression/test_single_poller_safety.py \
            tests/test_traffic_deep_link.py \
            tests/test_landing_ui_contract.py \
            tests/test_update_payload.py \
            tests/test_traffic_attribution.py \
            tests/test_system_conversion_mapping.py \
            tests/test_system_conversion_processor.py \
            tests/test_bot_paid_conversion_dedupe.py \
            tests/test_web_admin_passkey_contract.py \
            tests/test_public_security_fixes.py \
            tests/test_public_compose_security.py \
            tests/test_worker_health.py \
            tests/test_worker_health_collector.py \
            tests/test_migration_rehearsal.py \
            tests/test_postgres_migration_rehearsal.py \
            tests/test_migration_release_contract.py \
            tests/test_release_migration_safety.py

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Load Kamal config with synthetic registry secret
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          synthetic_registry_secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$synthetic_registry_secret" > .kamal/secrets
          unset synthetic_registry_secret
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          test "$(stat -c '%a' .kamal/secrets)" = 600
          bundle exec ruby -e 'abort unless Gem.loaded_specs.fetch("kamal").version.to_s == "2.12.0"'
          bundle exec kamal config >/dev/null
          bundle exec ruby -rkamal -e 'abort unless Kamal::Cli::Main.class_options.keys.map(&:to_s).include?("roles"); abort unless Kamal::Cli::Main.all_commands.key?("rollback")'
          python - <<'PY'
          import yaml
          with open('config/deploy.yml', encoding='utf-8') as stream:
              config = yaml.safe_load(stream)
          assert set(config['proxy']['hosts']) == {
              'maxibot.pro', 'www.maxibot.pro', 'api.maxibot.pro',
              'go.maxibot.pro', 'admin.maxibot.pro',
          }
          assert config['proxy']['ssl'] is True
          assert config['proxy']['app_port'] == 8000
          assert config['proxy']['healthcheck']['path'] == '/health/ready'
          assert set(config['servers']) == {'api', 'worker'}
          assert config['servers']['api'].get('proxy', True) is not False
          assert config['servers']['worker']['proxy'] is False
          PY
          rm -f .kamal/secrets
          test ! -e .kamal/secrets
  build:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: tests
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      image_version: ${{ steps.version.outputs.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set the immutable run-scoped image version
        id: version
        run: echo "value=$CANDIDATE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build once and push directly to GHCR
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=min
          tags: ghcr.io/akhripunov/maxibot-vps-api:${{ steps.version.outputs.value }}
          labels: |
            service=maxibot
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source-sha=${{ env.CANDIDATE_SHA }}
            org.maxibot.release.sha=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source=https://github.com/akhripunov/maxibot
            org.opencontainers.image.url=https://github.com/akhripunov/maxibot/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=maxibot-native
          cache-to: type=gha,scope=maxibot-native,mode=max
      - name: Record the immutable build output in the native run summary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/akhripunov/maxibot-vps-api@$IMAGE_DIGEST"
          manifest="$(docker buildx imagetools inspect "$IMAGE")"
          grep -Eq "^Digest:[[:space:]]+$IMAGE_DIGEST$" <<< "$manifest"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          {
            echo "MAXIBOT_BUILD_RUN_ID=$GITHUB_RUN_ID"
            echo "MAXIBOT_BUILD_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "MAXIBOT_BUILD_SHA=$CANDIDATE_SHA"
            printf "NATIVE_RELEASE_BUILD: \`%s\` → \`%s\`\n" "$CANDIDATE_SHA" "$IMAGE"
            echo 'MAXIBOT_GHCR_DIGEST_PLATFORM=PASS'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.result == 'success' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.operation == 'rollback')
      )
    needs:
      - tests
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      deployment: false
    permissions:
      actions: read
      contents: read
      packages: read
      deployments: write
    env:
      RELEASE_OPERATION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'deploy' || inputs.operation || '' }}
      BUILD_RUN_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || inputs.build_run_id }}
      BUILD_IMAGE_VERSION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.image_version || '' }}
      PRODUCTION_HOST: 135.106.166.46
      BUNDLE_GEMFILE: Gemfile.kamal
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select and verify the exact-SHA build image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_DIGEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.image_digest || inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_OPERATION" == deploy || "$RELEASE_OPERATION" == rollback ]]
          if [[ "$RELEASE_OPERATION" == deploy ]]; then test "$CANDIDATE_SHA" = "$GITHUB_SHA"; fi
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          build_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          if [[ "$RELEASE_OPERATION" == deploy ]]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$BUILD_RUN_ID" = "$GITHUB_RUN_ID"
            build_attempt="${BUILD_IMAGE_VERSION##*-}"
            [[ "$build_attempt" =~ ^[1-9][0-9]*$ ]]
            test "$BUILD_IMAGE_VERSION" = "$CANDIDATE_SHA-$BUILD_RUN_ID-$build_attempt"
            jq -e --arg sha "$CANDIDATE_SHA" --arg attempt "$build_attempt" \
              '.head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .run_attempt >= ($attempt | tonumber)
                and .path == ".github/workflows/maxibot-native-release.yml"
                and .status == "in_progress"' <<< "$build_run" >/dev/null
          else
            jq -e --arg sha "$CANDIDATE_SHA" \
              '.head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
                and .path == ".github/workflows/maxibot-native-release.yml"' \
              <<< "$build_run" >/dev/null
            build_attempt="$(jq -r .run_attempt <<< "$build_run")"
          fi
          [[ "$build_attempt" =~ ^[0-9]+$ ]]
          image_version="$CANDIDATE_SHA-$BUILD_RUN_ID-$build_attempt"
          image_tag="ghcr.io/akhripunov/maxibot-vps-api:$image_version"
          manifest="$(docker buildx imagetools inspect "$image_tag")"
          image_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$manifest")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$image_digest" = "$APPROVED_DIGEST"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          image_ref="ghcr.io/akhripunov/maxibot-vps-api@$image_digest"
          docker pull "$image_ref" >/dev/null
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          for label in org.opencontainers.image.revision org.opencontainers.image.source-sha org.maxibot.release.sha; do
            test "$(docker image inspect "$image_ref" --format "{{index .Config.Labels \"$label\"}}")" = "$CANDIDATE_SHA"
          done
          service_label="$(docker image inspect "$image_ref" --format '{{index .Config.Labels "service"}}')"
          test "$service_label" = maxibot
          {
            echo "image_version=$image_version"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_ref"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_VERSION=$image_version"
            echo "IMAGE_TAG=$image_tag"
            echo "IMAGE_REF=$image_ref"
          } >> "$GITHUB_ENV"
          printf "BUILD_RUN=%s (attempt %s)\nIMAGE_TAG=\`%s\`\nIMMUTABLE_IMAGE=\`%s\`\n" \
            "$BUILD_RUN_ID" "$build_attempt" "$image_tag" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Verify exact main and read the current production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SSH_KEY: ${{ secrets.MAXIBOT_PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.MAXIBOT_PRODUCTION_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { printf 'PRODUCTION_BASELINE=FAIL: %s\n' "$1" >&2; exit 1; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'candidate SHA is malformed'
          [[ "$IMAGE_REF" =~ ^ghcr\.io/akhripunov/maxibot-vps-api@sha256:[0-9a-f]{64}$ ]] || fail 'image reference is not an immutable GHCR digest'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || fail 'checkout does not match workflow SHA'
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" || fail 'GitHub main read failed'
          test "$main_sha" = "$GITHUB_SHA" || fail 'GitHub main no longer matches workflow SHA'
          for run_status in queued in_progress; do
            active_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$run_status&per_page=100")" || fail "GitHub $run_status Actions read failed"
            jq -e --arg current "$GITHUB_RUN_ID" 'all(.workflow_runs[]; (.id | tostring) == $current or .head_branch != "main" or .event != "push" or ((.name | test("release|deploy|cutover|kamal";"i")) | not))' <<< "$active_runs" >/dev/null || fail 'another MAXIBOT production release is queued or running'
          done
          test "$PRODUCTION_HOST" = 135.106.166.46 || fail 'production host does not match MAXIBOT VPS'
          if [[ -z "$PRODUCTION_SSH_KEY" || -z "$PRODUCTION_KNOWN_HOSTS" ]]; then fail 'production SSH credentials are not configured'; fi
          install -d -m 700 "$RUNNER_TEMP/ssh" "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          install -m 600 "$RUNNER_TEMP/ssh/id_ed25519" "$HOME/.ssh/id_ed25519"
          cat "$RUNNER_TEMP/ssh/known_hosts" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<EOF
          Host $PRODUCTION_HOST
            HostName $PRODUCTION_HOST
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"
          echo "PRODUCTION_SSH=$RUNNER_TEMP/ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "PRODUCTION_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"
          schema_query_b64="$(python scripts/verify_migration_schema_contract.py --print-query | base64 -w0)"
