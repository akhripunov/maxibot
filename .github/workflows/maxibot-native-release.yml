name: MAXIBOT — Native First V3 + Kamal 2
on:
  push:
    branches:
      - codex/native-release-maxibot
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact current main SHA from the successful main CI/Build
        required: true
        type: string
      build_run_id:
        description: Run ID of the successful main CI/Build to deploy
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest reported by that successful Build
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: maxibot-production-release
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
      BUNDLE_GEMFILE: Gemfile.kamal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before executing its code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$GITHUB_BASE_REF" = main
            test "$CANDIDATE_SHA" = "$GITHUB_HEAD_REF_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install existing test dependencies
        run: |
          python - <<'DEPS' > "$RUNNER_TEMP/test-requirements.txt"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          print('\n'.join(project['dependencies'] + project['optional-dependencies']['test']))
          DEPS
          python -m pip install --no-cache-dir pip==26.2.2
          python -m pip install -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Run the complete exact-candidate MAXIBOT suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Load Kamal config with synthetic registry secret
        env:
          MAXIBOT_COMMIT_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          synthetic_registry_secret="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$synthetic_registry_secret" > .kamal/secrets
          unset synthetic_registry_secret
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          test "$(stat -c '%a' .kamal/secrets)" = 600
          bundle exec ruby -e 'abort unless Gem.loaded_specs.fetch("kamal").version.to_s == "2.12.0"'
          bundle exec kamal config >/dev/null
          python - <<'PY'
          import yaml
          with open('config/deploy.yml', encoding='utf-8') as stream:
              config = yaml.safe_load(stream)
          assert set(config['proxy']['hosts']) == {
              'maxibot.pro', 'www.maxibot.pro', 'api.maxibot.pro',
              'go.maxibot.pro', 'admin.maxibot.pro',
          }
          assert config['proxy']['ssl'] is True
          assert config['proxy']['app_port'] == 8000
          assert config['proxy']['healthcheck']['path'] == '/health/ready'
          assert set(config['servers']) == {'api', 'worker'}
          assert config['servers']['api']['proxy'] is not False
          assert config['servers']['worker']['proxy'] is False
          PY
          rm -f .kamal/secrets
          test ! -e .kamal/secrets
  build:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-release-maxibot' && github.actor == github.repository_owner) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
          else
            test "$GITHUB_REF" = refs/heads/codex/native-release-maxibot
            test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set the immutable run-scoped image version
        id: version
        run: echo "value=$CANDIDATE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build once and push directly to GHCR
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=min
          tags: ghcr.io/akhripunov/maxibot-vps-api:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source-sha=${{ env.CANDIDATE_SHA }}
            org.maxibot.release.sha=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.source=https://github.com/akhripunov/maxibot
            org.opencontainers.image.url=https://github.com/akhripunov/maxibot/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=maxibot-native
          cache-to: type=gha,scope=maxibot-native,mode=max
      - name: Record the immutable build output in the native run summary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/akhripunov/maxibot-vps-api@$IMAGE_DIGEST"
          manifest="$(docker buildx imagetools inspect "$IMAGE")"
          grep -Eq "^Digest:[[:space:]]+$IMAGE_DIGEST$" <<< "$manifest"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          echo "MAXIBOT_BUILD_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "MAXIBOT_BUILD_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "MAXIBOT_BUILD_SHA=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'CI_BUILD_ONLY: `%s` → `%s`\n' "$CANDIDATE_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'MAXIBOT_GHCR_DIGEST_PLATFORM=PASS' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      actions: read
      contents: read
      packages: read
      deployments: write
    env:
      PRODUCTION_HOST: 135.106.166.46
      MAXIBOT_BACKUP_MAX_AGE_SECONDS: '86400'
      BUNDLE_GEMFILE: Gemfile.kamal
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select and verify the prior successful exact-SHA build image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          APPROVED_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          build_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          jq -e --arg sha "$CANDIDATE_SHA" \
            '.head_sha == $sha
              and .head_branch == "main"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
            and .path == ".github/workflows/maxibot-native-release.yml"' \
            <<< "$build_run" >/dev/null
          build_attempt="$(jq -r .run_attempt <<< "$build_run")"
          [[ "$build_attempt" =~ ^[0-9]+$ ]]
          image_version="$CANDIDATE_SHA-$BUILD_RUN_ID-$build_attempt"
          image_tag="ghcr.io/akhripunov/maxibot-vps-api:$image_version"
          manifest="$(docker buildx imagetools inspect "$image_tag")"
          image_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$manifest")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$image_digest" = "$APPROVED_DIGEST"
          grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64$' <<< "$manifest"
          image_ref="ghcr.io/akhripunov/maxibot-vps-api@$image_digest"
          docker pull "$image_ref" >/dev/null
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          for label in org.opencontainers.image.revision org.opencontainers.image.source-sha org.maxibot.release.sha; do
            test "$(docker image inspect "$image_ref" --format "{{index .Config.Labels \"$label\"}}")" = "$CANDIDATE_SHA"
          done
          {
            echo "image_version=$image_version"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_ref"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_VERSION=$image_version"
            echo "IMAGE_TAG=$image_tag"
            echo "IMAGE_REF=$image_ref"
          } >> "$GITHUB_ENV"
          printf 'PRIOR_BUILD_RUN=%s (attempt %s)\nIMAGE_TAG=`%s`\nIMMUTABLE_IMAGE=`%s`\n' \
            "$BUILD_RUN_ID" "$build_attempt" "$image_tag" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - name: Verify exact main and read the current production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SSH_KEY: ${{ secrets.MAXIBOT_PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.MAXIBOT_PRODUCTION_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/akhripunov/maxibot-vps-api@sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          test "$PRODUCTION_HOST" = 135.106.166.46
          test -n "$PRODUCTION_SSH_KEY" && test -n "$PRODUCTION_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          echo "PRODUCTION_SSH=$RUNNER_TEMP/ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "PRODUCTION_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"
          remote="$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          api_compose=maxibot-vps-api-1; worker_compose=maxibot-vps-worker-1
          db=maxibot-vps-db-1
          running() { [[ "$(docker inspect "$1" --format '{{.State.Running}}' 2>/dev/null || true)" == true ]]; }
          if running "$api_compose" && running "$worker_compose"; then
            mode=compose; api="$api_compose"; worker="$worker_compose"
          elif ! running "$api_compose" && ! running "$worker_compose"; then
            mapfile -t apis < <(docker ps -q --filter label=service=maxibot --filter label=role=api)
            mapfile -t workers < <(docker ps -q --filter label=service=maxibot --filter label=role=worker)
            [[ ${#apis[@]} == 1 && ${#workers[@]} == 1 ]]
            mode=kamal; api="${apis[0]}"; worker="${workers[0]}"
          else
            echo 'Mixed Compose/Kamal production topology; read-only reconciliation required.' >&2
            exit 1
          fi
          test "$(docker inspect maxibot-vps-db-1 --format '{{.State.Running}}')" = true
          test "$(docker inspect maxibot-vps-redis-1 --format '{{.State.Running}}')" = true
          if [[ "$mode" == compose ]]; then
            test "$(docker inspect maxibot-vps-https-1 --format '{{.State.Running}}')" = true
          else
            test "$(docker inspect maxibot-vps-https-1 --format '{{.State.Running}}')" = false
            test "$(docker inspect kamal-proxy --format '{{.State.Running}}')" = true
          fi
          sha="$(docker exec "$api" python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready",timeout=5))["commit_sha"])')"
          worker_sha="$(docker inspect "$worker" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MAXIBOT_COMMIT_SHA=//p')"
          test "$sha" = "$worker_sha"
          head="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')"
          db_id="$(docker inspect "$db" --format '{{.Id}}')"
          redis_id="$(docker inspect maxibot-vps-redis-1 --format '{{.Id}}')"
          caddy_id="$(docker inspect maxibot-vps-https-1 --format '{{.Id}}')"
          db_volume="$(docker inspect "$db" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}')"
          redis_volume="$(docker inspect maxibot-vps-redis-1 --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          uploads_volume="$(docker inspect "$api" --format '{{range .Mounts}}{{if eq .Destination "/app/uploads"}}{{.Name}}{{end}}{{end}}')"
          printf '%s|%s|%s|%s|%s|%s|%s|%s|%s\n' "$sha" "$head" "$mode" "$db_id" "$redis_id" "$caddy_id" "$db_volume" "$redis_volume" "$uploads_volume"
          REMOTE
          )"
          IFS='|' read -r baseline_sha database_head baseline_mode old_db_id old_redis_id old_caddy_id old_db_volume old_redis_volume old_uploads_volume <<< "$remote"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$database_head" =~ ^[A-Za-z0-9_]+$ ]]
          [[ "$baseline_mode" == compose || "$baseline_mode" == kamal ]]
          [[ "$old_db_id" =~ ^[0-9a-f]{64}$ && "$old_redis_id" =~ ^[0-9a-f]{64}$ && "$old_caddy_id" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$old_db_volume" && -n "$old_redis_volume" && -n "$old_uploads_volume" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$MAXIBOT_BACKUP_MAX_AGE_SECONDS" =~ ^[0-9]+$ ]]
          test "$MAXIBOT_BACKUP_MAX_AGE_SECONDS" = 86400
          backup_remote="$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "root@$PRODUCTION_HOST" bash -s -- "$GITHUB_RUN_ID" "$MAXIBOT_BACKUP_MAX_AGE_SECONDS" <<'REMOTE'
          set -Eeuo pipefail
          run_id="$1"
          max_age="$2"
          [[ "$run_id" =~ ^[0-9]+$ && "$max_age" =~ ^[0-9]+$ ]]
          root=/opt/maxibot
          backup_dir="$root/backups"
          db=maxibot-vps-db-1
          test -d "$backup_dir"
          backup_path="$(find "$backup_dir" -maxdepth 1 -type f -name 'maxibot-db-*.dump' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')"
          [[ "$backup_path" == "$backup_dir"/maxibot-db-*.dump ]]
          backup_epoch="$(stat -c %Y "$backup_path")"
          backup_bytes="$(stat -c %s "$backup_path")"
          backup_age=$(($(date +%s) - backup_epoch))
          [[ "$backup_epoch" =~ ^[0-9]+$ && "$backup_bytes" =~ ^[0-9]+$ ]]
          (( backup_bytes > 0 && backup_age >= 0 && backup_age <= max_age ))
          docker exec -i "$db" pg_restore --list < "$backup_path" >/dev/null
          database_head="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')"
          source_extensions="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "select string_agg(extname, ',' order by extname) from pg_extension")"
          source_tables="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema not in ('pg_catalog','information_schema')")"
          source_db_bytes="$(docker exec "$db" psql -X -U maxibot -d maxibot -At -v ON_ERROR_STOP=1 -c "select pg_database_size('maxibot')")"
          [[ "$source_db_bytes" =~ ^[0-9]+$ ]]
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          free_kb="$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')"
          required_kb=$(((source_db_bytes * 3 / 2 + backup_bytes * 2 + 134217728) / 1024))
          [[ "$free_kb" =~ ^[0-9]+$ ]]
          (( free_kb >= required_kb ))
          db_image="$(docker inspect "$db" --format '{{.Image}}')"
          [[ "$db_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          restore_name="maxibot-native-restore-$run_id"
          if docker container inspect "$restore_name" >/dev/null 2>&1; then
            echo 'A restore-probe container with this run id already exists; refusing to touch it.' >&2
            exit 1
          fi
          restore_started=0
          cleanup_restore() {
            status=$?
            trap - EXIT
            if (( restore_started )) && docker container inspect "$restore_name" >/dev/null 2>&1; then
              docker rm -f "$restore_name" >/dev/null || status=1
            fi
            exit "$status"
          }
          trap cleanup_restore EXIT
          docker run --detach --rm --name "$restore_name" --network none \
            --mount "type=bind,src=$backup_path,dst=/tmp/maxibot-backup.dump,readonly" \
            -e POSTGRES_USER=maxibot -e POSTGRES_DB=postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            "$db_image" >/dev/null
          restore_started=1
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$restore_name" pg_isready -U maxibot -d postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec "$restore_name" createdb -U maxibot native_restore_probe
          docker exec "$restore_name" pg_restore --exit-on-error --no-owner --no-privileges -U maxibot -d native_restore_probe /tmp/maxibot-backup.dump >/dev/null
          restored_head="$(docker exec "$restore_name" psql -X -U maxibot -d native_restore_probe -At -v ON_ERROR_STOP=1 -c 'select version_num from alembic_version')"
          restored_extensions="$(docker exec "$restore_name" psql -X -U maxibot -d native_restore_probe -At -v ON_ERROR_STOP=1 -c "select string_agg(extname, ',' order by extname) from pg_extension")"
          restored_tables="$(docker exec "$restore_name" psql -X -U maxibot -d native_restore_probe -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema not in ('pg_catalog','information_schema')")"
          test "$restored_head" = "$database_head"
          test "$restored_extensions" = "$source_extensions"
          test "$restored_tables" = "$source_tables"
          backup_sha256="$(sha256sum "$backup_path" | awk '{print $1}')"
          [[ "$backup_sha256" =~ ^[0-9a-f]{64}$ ]]
          docker rm -f "$restore_name" >/dev/null
          trap - EXIT
          printf '%s|%s|%s|%s|%s|%s\n' "$backup_epoch" "$backup_bytes" "$backup_sha256" "$database_head" "$restored_head" "$restored_tables"
          REMOTE
          )"
          IFS='|' read -r backup_epoch backup_bytes backup_sha256 backup_db_head restored_db_head restored_tables <<< "$backup_remote"
          [[ "$backup_epoch" =~ ^[0-9]+$ && "$backup_bytes" =~ ^[0-9]+$ && "$backup_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$restored_tables" =~ ^[0-9]+$ ]]
          test "$backup_db_head" = "$database_head" && test "$restored_db_head" = "$database_head"
          backup_time_utc="$(date -u -d "@$backup_epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'NATIVE_BACKUP_FRESHNESS=PASS: `%s`, %s bytes, SHA-256 `%s`\nNATIVE_BACKUP_RESTORE=PASS: isolated offline Docker restore; database head `%s`, restored tables `%s`.\n' "$backup_time_utc" "$backup_bytes" "$backup_sha256" "$database_head" "$restored_tables" >> "$GITHUB_STEP_SUMMARY"
          git cat-file -e "$baseline_sha^{commit}"
          if ! git diff --quiet "$baseline_sha" "$CANDIDATE_SHA" -- alembic app/db/models.py docker-compose.vps.yml; then
            echo 'Native runtime Apply refuses database/model or production Compose changes; migration gates are not implemented in this candidate.' >&2
            exit 1
          fi
          if ! git diff --quiet "$baseline_sha" "$CANDIDATE_SHA" -- docs/frozen_paths.yaml scripts/frozen_path_guard.sh; then
            echo 'Native runtime Apply refuses edits to the frozen-path policy or its guard.' >&2
            exit 1
          fi
          bash scripts/frozen_path_guard.sh --base "$baseline_sha" --head "$CANDIDATE_SHA"
          echo 'FROZEN_PATH_REGRESSION=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "database_head=$database_head" >> "$GITHUB_OUTPUT"
          echo "baseline_mode=$baseline_mode" >> "$GITHUB_OUTPUT"
          echo "old_db_id=$old_db_id" >> "$GITHUB_OUTPUT"
          echo "old_redis_id=$old_redis_id" >> "$GITHUB_OUTPUT"
          echo "old_caddy_id=$old_caddy_id" >> "$GITHUB_OUTPUT"
          echo "old_db_volume=$old_db_volume" >> "$GITHUB_OUTPUT"
          echo "old_redis_volume=$old_redis_volume" >> "$GITHUB_OUTPUT"
          echo "old_uploads_volume=$old_uploads_volume" >> "$GITHUB_OUTPUT"
      - name: Verify exact GHCR image and Kamal configuration
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_MODE: ${{ steps.baseline.outputs.baseline_mode }}
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          test "$BASELINE_MODE" = kamal || { echo 'FIRST_COMPOSE_TO_KAMAL_CUTOVER_REQUIRED=BLOCKED' >&2; exit 1; }
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          mapfile -t apis < <(docker ps -q --filter label=service=maxibot --filter label=role=api)
          mapfile -t workers < <(docker ps -q --filter label=service=maxibot --filter label=role=worker)
          [[ ${#apis[@]} == 1 && ${#workers[@]} == 1 ]]
          api="${apis[0]}"; worker="${workers[0]}"
          python3 - "$api" "$worker" <<'PY'
          import json, subprocess, sys
          api, worker = sys.argv[1:]
          items = json.loads(subprocess.check_output(["docker", "inspect", api, worker], text=True))
          by_id = {item["Id"]: item for item in items}
          assert "kamal" in by_id[api]["NetworkSettings"]["Networks"]
          assert "kamal" in by_id[worker]["NetworkSettings"]["Networks"]
          caddy = json.loads(subprocess.check_output(["docker", "inspect", "maxibot-vps-https-1"], text=True))[0]
          assert caddy["State"]["Running"] is False
          proxy = json.loads(subprocess.check_output(["docker", "inspect", "kamal-proxy"], text=True))[0]
          assert proxy["State"]["Running"] is True
          for name, alias in (("maxibot-vps-db-1", "db"), ("maxibot-vps-redis-1", "redis")):
              c = json.loads(subprocess.check_output(["docker", "inspect", name], text=True))[0]
              assert {"maxibot-vps-internal", "kamal"} <= set(c["NetworkSettings"]["Networks"])
              assert alias in c["NetworkSettings"]["Networks"]["kamal"]["Aliases"]
          caddy = json.loads(subprocess.check_output(["docker", "inspect", "maxibot-vps-https-1"], text=True))[0]
          assert "maxibot-vps-frontend" in caddy["NetworkSettings"]["Networks"]
          subprocess.run(["docker", "exec", api, "python", "-c", "import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]"], check=True)
          env = dict(x.split("=",1) for x in by_id[api]["Config"]["Env"] if "=" in x)
          worker_env = dict(x.split("=",1) for x in by_id[worker]["Config"]["Env"] if "=" in x)
          assert env.get("MAX_RUN_POLLING") == "false"
          assert worker_env.get("MAX_RUN_POLLING") == "true"
          assert by_id[worker]["HostConfig"]["Memory"] == 536870912
          assert not by_id[worker]["State"]["OOMKilled"]
          ids = subprocess.check_output(["docker", "ps", "-q"], text=True).split()
          running = json.loads(subprocess.check_output(["docker", "inspect", *ids], text=True)) if ids else []
          pollers = [item["Id"] for item in running if "MAX_RUN_POLLING=true" in item["Config"].get("Env", [])]
          assert pollers == [worker], pollers
          PY
          REMOTE
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CANDIDATE_SHA"
          [[ "$IMAGE_VERSION" =~ ^$CANDIDATE_SHA-[0-9]+-[0-9]+$ ]]
          approved_digest="$(printf '%s\n' "$IMAGE_REF" | cut -d@ -f2)"
          [[ "$approved_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_readback="$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '/^Digest:/ {print $2; exit}')"
          test "$digest_readback" = "$approved_digest"
          docker pull "$IMAGE_REF" >/dev/null
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          for label in org.opencontainers.image.revision org.opencontainers.image.source-sha org.maxibot.release.sha; do
            test "$(docker image inspect "$IMAGE_REF" --format "{{index .Config.Labels \"$label\"}}")" = "$CANDIDATE_SHA"
          done
          export MAXIBOT_COMMIT_SHA="$CANDIDATE_SHA"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal config >/dev/null
          bundle exec kamal registry login
      - name: Deploy application with Kamal
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" 'docker network inspect kamal >/dev/null'
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles api
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/live >/dev/null
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          for host in maxibot.pro www.maxibot.pro api.maxibot.pro go.maxibot.pro admin.maxibot.pro; do
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 --resolve "$host:443:$PRODUCTION_HOST" "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 "https://$host/health/ready" | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
            redirect="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' --resolve "$host:80:$PRODUCTION_HOST" "http://$host/health/ready")"
            [[ "$redirect" == https://* ]]
          done
          admin_headers="$RUNNER_TEMP/maxibot-admin-headers.txt"
          curl --silent --show-error --fail --resolve "admin.maxibot.pro:443:$PRODUCTION_HOST" --dump-header "$admin_headers" https://admin.maxibot.pro/ -o "$RUNNER_TEMP/maxibot-admin.html"
          grep -qi '^content-security-policy:' "$admin_headers"
          grep -qi '^strict-transport-security:' "$admin_headers"
          grep -qi '^x-frame-options: DENY' "$admin_headers"
          grep -qi '^x-content-type-options: nosniff' "$admin_headers"
          grep -qi '^referrer-policy: no-referrer' "$admin_headers"
          grep -qi '^cache-control: no-store' "$admin_headers"
          grep -q 'OWNER CONSOLE' "$RUNNER_TEMP/maxibot-admin.html"
      - name: Stop the existing Kamal Worker before starting its replacement
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal app stop --roles worker
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          ids="$(docker ps -q)"
          if [[ -n "$ids" ]]; then
            docker inspect $ids | python3 -c 'import json,sys; xs=json.load(sys.stdin); ps=[x["Id"] for x in xs if "MAX_RUN_POLLING=true" in x["Config"].get("Env",[])]; assert not ps, ps'
          fi
          REMOTE
      - name: Deploy the sole Worker with Kamal
        run: |
          set -euo pipefail
          install -d -m 700 .kamal
          umask 077
          trap 'rm -f .kamal/secrets' EXIT
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$KAMAL_REGISTRY_PASSWORD" > .kamal/secrets
          chmod 600 .kamal/secrets
          git check-ignore -q .kamal/secrets
          bundle exec kamal deploy --skip-push --version "$IMAGE_VERSION" --roles worker
      - name: Verify runtime, network connectivity, and Worker heartbeat
        env:
          EXPECTED_DATABASE_HEAD: ${{ steps.baseline.outputs.database_head }}
          EXPECTED_DB_ID: ${{ steps.baseline.outputs.old_db_id }}
          EXPECTED_REDIS_ID: ${{ steps.baseline.outputs.old_redis_id }}
          EXPECTED_CADDY_ID: ${{ steps.baseline.outputs.old_caddy_id }}
          EXPECTED_DB_VOLUME: ${{ steps.baseline.outputs.old_db_volume }}
          EXPECTED_REDIS_VOLUME: ${{ steps.baseline.outputs.old_redis_volume }}
          EXPECTED_UPLOADS_VOLUME: ${{ steps.baseline.outputs.old_uploads_volume }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 2 https://api.maxibot.pro/health/ready | python -c 'import json,sys; assert json.load(sys.stdin)["commit_sha"] == sys.argv[1]' "$CANDIDATE_SHA"
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" bash -s -- "$CANDIDATE_SHA" "$IMAGE_VERSION" "$IMAGE_REF" "$EXPECTED_DATABASE_HEAD" "$EXPECTED_DB_ID" "$EXPECTED_REDIS_ID" "$EXPECTED_CADDY_ID" "$EXPECTED_DB_VOLUME" "$EXPECTED_REDIS_VOLUME" "$EXPECTED_UPLOADS_VOLUME" <<'REMOTE'
          set -euo pipefail
          sha="$1"; version="$2"; image_ref="$3"; expected_db_head="$4"
          expected_db_id="$5"; expected_redis_id="$6"; expected_caddy_id="$7"
          expected_db_volume="$8"; expected_redis_volume="$9"; expected_uploads_volume="${10}"
          mapfile -t apis < <(docker ps -q --filter label=service=maxibot --filter label=role=api)
          mapfile -t workers < <(docker ps -q --filter label=service=maxibot --filter label=role=worker)
          [[ ${#apis[@]} == 1 && ${#workers[@]} == 1 ]]
          api="${apis[0]}"; worker="${workers[0]}"
          python3 - "$api" "$worker" "$sha" "$version" "$image_ref" "$expected_db_head" "$expected_db_id" "$expected_redis_id" "$expected_caddy_id" "$expected_db_volume" "$expected_redis_volume" "$expected_uploads_volume" <<'PY'
          import json, subprocess, sys
          api, worker, sha, version, image_ref, expected_db_head, expected_db_id, expected_redis_id, expected_caddy_id, expected_db_volume, expected_redis_volume, expected_uploads_volume = sys.argv[1:]
          items = json.loads(subprocess.check_output(["docker", "inspect", api, worker], text=True))
          by_id = {item["Id"]: item for item in items}
          for cid, required_networks, polling in ((api, {"kamal"}, "false"), (worker, {"kamal"}, "true")):
              c = by_id[cid]
              assert c["State"]["Running"]
              assert c["Config"]["Image"] == f"ghcr.io/akhripunov/maxibot-vps-api:{version}"
              assert c["Config"]["Labels"]["org.opencontainers.image.revision"] == sha
              assert required_networks <= set(c["NetworkSettings"]["Networks"])
              env = dict(x.split("=",1) for x in c["Config"]["Env"] if "=" in x)
              assert env.get("MAX_RUN_POLLING") == polling
              image = json.loads(subprocess.check_output(["docker","image","inspect",c["Image"]],text=True))[0]
              assert image_ref in image.get("RepoDigests",[])
          for name in ("maxibot-vps-db-1","maxibot-vps-redis-1"):
              c=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert {"maxibot-vps-internal","kamal"} <= set(c["NetworkSettings"]["Networks"])
              alias = "db" if name.endswith("db-1") else "redis"
              assert alias in c["NetworkSettings"]["Networks"]["kamal"]["Aliases"]
              assert c["Id"] == (expected_db_id if alias == "db" else expected_redis_id)
              destination = "/var/lib/postgresql/data" if alias == "db" else "/data"
              volume = next(m["Name"] for m in c["Mounts"] if m["Destination"] == destination)
              assert volume == (expected_db_volume if alias == "db" else expected_redis_volume)
          caddy=json.loads(subprocess.check_output(["docker","inspect","maxibot-vps-https-1"],text=True))[0]
          assert caddy["Id"] == expected_caddy_id
          assert caddy["State"]["Running"] is False
          proxy=json.loads(subprocess.check_output(["docker","inspect","kamal-proxy"],text=True))[0]
          assert proxy["State"]["Running"] is True
          ports=proxy["NetworkSettings"]["Ports"]
          assert ports["80/tcp"] and ports["443/tcp"]
          for name in ("maxibot-vps-api-1", "maxibot-vps-worker-1"):
              old=json.loads(subprocess.check_output(["docker","inspect",name],text=True))[0]
              assert not old["State"]["Running"], (name, old["State"])
          uploads=next(m["Name"] for m in by_id[api]["Mounts"] if m["Destination"] == "/app/uploads")
          assert uploads == expected_uploads_volume
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]"],check=True)
          ids=subprocess.check_output(["docker","ps","-q"],text=True).split()
          allc=json.loads(subprocess.check_output(["docker","inspect",*ids],text=True)) if ids else []
          assert not any("caddy" in (c["Name"]+c["Config"].get("Image","")).lower() for c in allc)
          pollers=[c["Id"] for c in allc if "MAX_RUN_POLLING=true" in c["Config"].get("Env",[])]
          assert pollers == [worker], pollers
          assert by_id[worker]["HostConfig"]["Memory"] == 536870912
          assert subprocess.check_output(["docker","exec",worker,"cat","/sys/fs/cgroup/memory.max"],text=True).strip() == "536870912"
          db_head=subprocess.check_output(["docker","exec","maxibot-vps-db-1","psql","-X","-U","maxibot","-d","maxibot","-At","-v","ON_ERROR_STOP=1","-c","select version_num from alembic_version"],text=True).strip()
          assert db_head == expected_db_head
          for name, cmd in (("maxibot-vps-db-1",["pg_isready","-U","maxibot","-d","maxibot"]),("maxibot-vps-redis-1",["redis-cli","ping"])):
              subprocess.run(["docker","exec",name,*cmd],check=True,stdout=subprocess.DEVNULL)
          subprocess.run(["docker","exec",api,"python","-c","import socket; [socket.create_connection((h,p),timeout=5).close() for h,p in [('db',5432),('redis',6379)]"],check=True)
          PY
          REMOTE
          cat app/worker_health.py scripts/worker_health_preflight.py > "$RUNNER_TEMP/maxibot-worker-health.py"
          scp -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "$RUNNER_TEMP/maxibot-worker-health.py" "root@$PRODUCTION_HOST:/tmp/maxibot-worker-health-$GITHUB_RUN_ID.py"
          worker_id="$(ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "docker ps -q --filter label=service=maxibot --filter label=role=worker")"
          [[ "$worker_id" =~ ^[0-9a-f]{64}$ ]]
          ssh -i "$PRODUCTION_SSH" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PRODUCTION_KNOWN_HOSTS_FILE" "root@$PRODUCTION_HOST" "python3 /tmp/maxibot-worker-health-$GITHUB_RUN_ID.py --container '$worker_id' --interval 35 --max-age 90 --expected-release '$CANDIDATE_SHA'"
          echo 'MAXIBOT_KAMAL_DEPLOY_VERIFY=PASS' >> "$GITHUB_STEP_SUMMARY"
