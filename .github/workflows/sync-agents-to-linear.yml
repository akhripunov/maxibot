name: Sync AGENTS.md to Linear

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_DOCUMENT_ID: b0924f59-ceaa-411e-a274-880f802e8f9a
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate Python syntax
        run: python -m py_compile scripts/sync_agents_to_linear.py

      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Update existing Linear document and verify read-back
        run: python scripts/sync_agents_to_linear.py
