name: MAXIBOT — Deploy
run-name: MAXIBOT ${{ inputs.mode }} ${{ inputs.candidate }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Exact full SHA from a successful MAXIBOT — Prepare run'
        required: true
        type: string
      target_migration:
        description: 'Exact intended Alembic head supplied by Dev'
        required: true
        type: string
      mode:
        description: 'preflight checks production; production applies the candidate'
        required: true
        default: preflight
        type: choice
        options: [preflight, production]
      approve_production:
        description: 'I authorize this exact candidate and Alembic target on MAXIBOT production'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
      target_migration: ${{ steps.select.outputs.target_migration }}
      prepare_run_id: ${{ steps.select.outputs.prepare_run_id }}
      prepare_run_attempt: ${{ steps.select.outputs.prepare_run_attempt }}
      prepare_url: ${{ steps.select.outputs.prepare_url }}
    steps:
      - name: Checkout trusted main workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify approval, current main and latest successful Prepare
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
          TARGET_MIGRATION: ${{ inputs.target_migration }}
          RELEASE_MODE: ${{ inputs.mode }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
        run: python3 scripts/validate_release_dispatch.py

  deploy:
    needs: validate
    runs-on: [self-hosted, macOS, maxibot-production]
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
      TARGET_MIGRATION: ${{ needs.validate.outputs.target_migration }}
      PREPARE_RUN_ID: ${{ needs.validate.outputs.prepare_run_id }}
      PREPARE_RUN_ATTEMPT: ${{ needs.validate.outputs.prepare_run_attempt }}
      RELEASE_MODE: ${{ inputs.mode }}
      APPROVE_PRODUCTION: ${{ inputs.approve_production }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set result evidence path
        shell: bash
        run: echo "RELEASE_RESULT=$RUNNER_TEMP/maxibot-release-result-$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"

      - name: Configure writable job-local tool cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/maxibot-toolcache"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/maxibot-toolcache" >> "$GITHUB_ENV"

      - name: Checkout the approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.candidate }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.0

      - name: Install portable Python 3.12.10
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/maxibot-python/install
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/maxibot-python/bin
        run: |
          uv python install 3.12.10
          python_path="$(uv python find --managed-python 3.12.10)"
          test -x "$python_path"
          echo "MAXIBOT_PYTHON=$python_path" >> "$GITHUB_ENV"

      - name: Verify Python runtime
        run: '"$MAXIBOT_PYTHON" --version | grep -Fx "Python 3.12.10"'

      - name: Download exact prepared image artifact
        uses: actions/download-artifact@v4
        with:
          name: maxibot-image-${{ needs.validate.outputs.candidate }}-${{ needs.validate.outputs.prepare_run_id }}-${{ needs.validate.outputs.prepare_run_attempt }}
          path: ${{ runner.temp }}/maxibot-prepared-image
          run-id: ${{ needs.validate.outputs.prepare_run_id }}
          github-token: ${{ github.token }}

      - name: Recheck current main and Prepare provenance on the Mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ needs.validate.outputs.prepare_run_id }}
          PREPARE_RUN_ATTEMPT: ${{ needs.validate.outputs.prepare_run_attempt }}
        run: '"$MAXIBOT_PYTHON" scripts/validate_release_dispatch.py'

      - name: Verify and load the prepared image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-${{ needs.validate.outputs.candidate }}.tar
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-manifest.json
        run: '"$MAXIBOT_PYTHON" scripts/verify_prepared_image.py'

      - name: Verify exact candidate checkout is still clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Run production preflight and requested release mode
        id: execute
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-${{ needs.validate.outputs.candidate }}.tar
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-manifest.json
        run: '"$MAXIBOT_PYTHON" scripts/run_release_workflow.py'

      - name: Publish preflight result to MAXIBOT Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RELEASE_PHASE: preflight
          RELEASE_STATUS: ${{ steps.execute.outputs.preflight == 'PASS' && 'READY' || (steps.execute.outcome == 'skipped' && 'BLOCKED' || 'FAILED') }}
          RELEASE_RESULT: ${{ env.RELEASE_RESULT }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: '"$MAXIBOT_PYTHON" scripts/publish_release_to_linear.py'

      - name: Publish production result to MAXIBOT Linear
        if: always() && inputs.mode == 'production' && steps.execute.outcome != 'skipped'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RELEASE_PHASE: production
          RELEASE_STATUS: ${{ steps.execute.outputs.status || 'FAILED' }}
          RELEASE_RESULT: ${{ env.RELEASE_RESULT }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: '"$MAXIBOT_PYTHON" scripts/publish_release_to_linear.py'

      - name: Preserve exact release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxibot-release-result-${{ github.run_id }}
          path: ${{ env.RELEASE_RESULT }}
          if-no-files-found: warn
          retention-days: 90
