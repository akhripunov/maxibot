name: MAXIBOT — Deploy
run-name: MAXIBOT ${{ inputs.mode }} ${{ inputs.candidate }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Exact full SHA from a successful MAXIBOT — Prepare run'
        required: true
        type: string
      target_migration:
        description: 'Exact intended Alembic head supplied by Dev'
        required: true
        type: string
      mode:
        description: 'preflight checks production; production applies the candidate'
        required: true
        default: preflight
        type: choice
        options: [preflight, production]
      approve_production:
        description: 'I authorize this exact candidate and Alembic target on MAXIBOT production'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: maxibot-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      candidate: ${{ steps.select.outputs.candidate }}
      target_migration: ${{ steps.select.outputs.target_migration }}
      prepare_artifact_id: ${{ steps.select.outputs.prepare_artifact_id }}
      prepare_run_id: ${{ steps.select.outputs.prepare_run_id }}
      prepare_run_attempt: ${{ steps.select.outputs.prepare_run_attempt }}
      prepare_url: ${{ steps.select.outputs.prepare_url }}
      network_retry_budget_used_seconds: ${{ steps.select.outputs.network_retry_budget_used_seconds }}
    steps:
      - name: Initialize shared retry budget
        shell: bash
        run: |
          echo "NETWORK_RETRY_BUDGET_STATE=$RUNNER_TEMP/maxibot-network-retry-budget-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf '0\n' > "$RUNNER_TEMP/maxibot-network-retry-budget-$GITHUB_RUN_ID"
      - name: Checkout trusted main workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify approval, current main and latest successful Prepare
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
          TARGET_MIGRATION: ${{ inputs.target_migration }}
          RELEASE_MODE: ${{ inputs.mode }}
          APPROVE_PRODUCTION: ${{ inputs.approve_production }}
        run: python3 scripts/validate_release_dispatch.py

  deploy:
    needs: validate
    runs-on: [self-hosted, macOS, maxibot-production]
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    outputs:
      preflight: ${{ steps.execute.outputs.preflight }}
      status: ${{ steps.execute.outputs.status }}
      execute_outcome: ${{ steps.execute.outcome }}
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
      TARGET_MIGRATION: ${{ needs.validate.outputs.target_migration }}
      PREPARE_ARTIFACT_ID: ${{ needs.validate.outputs.prepare_artifact_id }}
      PREPARE_RUN_ID: ${{ needs.validate.outputs.prepare_run_id }}
      PREPARE_RUN_ATTEMPT: ${{ needs.validate.outputs.prepare_run_attempt }}
      RELEASE_MODE: ${{ inputs.mode }}
      APPROVE_PRODUCTION: ${{ inputs.approve_production }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set result evidence path
        shell: bash
        run: |
          echo "RELEASE_RESULT=$RUNNER_TEMP/maxibot-release-result-$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
          echo "NETWORK_RETRY_BUDGET_STATE=$RUNNER_TEMP/maxibot-network-retry-budget-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf '%s\n' '${{ needs.validate.outputs.network_retry_budget_used_seconds }}' > "$RUNNER_TEMP/maxibot-network-retry-budget-$GITHUB_RUN_ID"

      - name: Configure writable persistent tool cache
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/maxibot-release/toolcache"
          echo "RUNNER_TOOL_CACHE=$HOME/.cache/maxibot-release/toolcache" >> "$GITHUB_ENV"

      - name: Checkout the approved candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.candidate }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.0
          prune-cache: false

      - name: Install portable Python 3.12.10
        run: |
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TOOL_CACHE/maxibot-python/install"
          export UV_PYTHON_BIN_DIR="$RUNNER_TOOL_CACHE/maxibot-python/bin"
          uv python install 3.12.10
          python_path="$(uv python find --managed-python 3.12.10)"
          test -x "$python_path"
          echo "MAXIBOT_PYTHON=$python_path" >> "$GITHUB_ENV"

      - name: Verify Python runtime
        run: '"$MAXIBOT_PYTHON" --version | grep -Fx "Python 3.12.10"'

      - name: Recheck current main and Prepare provenance on the Mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$MAXIBOT_PYTHON" scripts/validate_release_dispatch.py'

      - name: Restore or download the verified immutable artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_DESTINATION: ${{ runner.temp }}/maxibot-prepared-image
        run: '"$MAXIBOT_PYTHON" scripts/prepared_artifact_cache.py'

      - name: Verify and load the prepared image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-${{ needs.validate.outputs.candidate }}.tar.gz
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-manifest.json
        run: '"$MAXIBOT_PYTHON" scripts/verify_prepared_image.py'

      - name: Verify exact candidate checkout is still clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Run production preflight and requested release mode
        id: execute
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-${{ needs.validate.outputs.candidate }}.tar.gz
          IMAGE_MANIFEST: ${{ runner.temp }}/maxibot-prepared-image/maxibot-image-manifest.json
        run: '"$MAXIBOT_PYTHON" scripts/run_release_workflow.py'

      - name: Preserve exact release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxibot-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RESULT }}
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [validate, deploy]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: maxibot-linear-release
      cancel-in-progress: false
    env:
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate }}
      RELEASE_MODE: ${{ inputs.mode }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      TARGET_MIGRATION: ${{ needs.validate.outputs.target_migration }}
    steps:
      - name: Set publication evidence path
        shell: bash
        run: echo "RELEASE_RESULT=$RUNNER_TEMP/release-evidence/maxibot-release-result-$GITHUB_RUN_ID.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.candidate }}
      - name: Read saved release evidence
        if: needs.deploy.outputs.status != ''
        uses: actions/download-artifact@v4
        with:
          name: maxibot-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
      - name: Publish preflight result to MAXIBOT Linear
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RELEASE_PHASE: preflight
          RELEASE_STATUS: ${{ needs.deploy.outputs.preflight == 'PASS' && 'READY' || (needs.deploy.outputs.execute_outcome == 'skipped' && 'BLOCKED' || 'FAILED') }}
        run: python3 scripts/publish_release_to_linear.py
      - name: Publish production result to MAXIBOT Linear
        if: always() && inputs.mode == 'production' && needs.deploy.outputs.status != ''
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RELEASE_PHASE: production
          RELEASE_STATUS: ${{ needs.deploy.outputs.execute_outcome == 'success' && needs.deploy.outputs.status || (needs.deploy.outputs.status == 'COMPLETE' && 'RECOVERY_REQUIRED' || needs.deploy.outputs.status || 'FAILED') }}
        run: python3 scripts/publish_release_to_linear.py
