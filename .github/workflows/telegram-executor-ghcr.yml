name: Telegram executor immutable image

on:
  push:
    tags:
      - "executor-candidate-*"

permissions: {}

jobs:
  validate:
    if: github.repository == 'akhripunov/maxibot' && github.actor == 'akhripunov' && startsWith(github.ref, 'refs/tags/executor-candidate-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout exact tagged commit without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate owner tag, exact checkout, and trusted main ancestry
        id: validate
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_REPOSITORY" = "akhripunov/maxibot"
          test "$EVENT_ACTOR" = "akhripunov"
          [[ "$EVENT_REF" =~ ^refs/tags/executor-candidate-([0-9a-f]{40})$ ]]
          SOURCE_SHA="${BASH_REMATCH[1]}"
          test "$SOURCE_SHA" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXECUTOR_CANDIDATE_VALIDATED=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: needs.validate.result == 'success' && github.repository == 'akhripunov/maxibot' && github.actor == 'akhripunov' && startsWith(github.ref, 'refs/tags/executor-candidate-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maxibot-telegram-executor
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Checkout validated exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm publish checkout remains exact validated SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable executor image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/telegram-executor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
          build-args: |
            RELEASE_SHA=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source-sha=${{ env.SOURCE_SHA }}
            org.maxibot.release.sha=${{ env.SOURCE_SHA }}

      - name: Verify remote immutable artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker pull "$IMAGE:$SOURCE_SHA"
          docker buildx imagetools inspect "$IMAGE:$SOURCE_SHA" | tee /tmp/executor-manifest.txt
          grep -q 'linux/amd64' /tmp/executor-manifest.txt
          REMOTE_SHA="$(docker image inspect "$IMAGE:$SOURCE_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$REMOTE_SHA" = "$SOURCE_SHA"
          {
            echo "## Telegram executor artifact"
            echo "EXECUTOR_IMAGE_REMOTE_REF=$IMAGE:$SOURCE_SHA"
            echo "EXECUTOR_IMAGE_DIGEST=$DIGEST"
            echo "EXECUTOR_IMAGE_PLATFORM=linux/amd64"
            echo "EXECUTOR_IMAGE_SOURCE_SHA=$SOURCE_SHA"
            echo "EXECUTOR_IMAGE_REMOTE_VERIFIED=YES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write non-secret release manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          out = {
              "schema": "MAXIBOT_TELEGRAM_EXECUTOR_RELEASE_MANIFEST_V1",
              "source_sha": os.environ["SOURCE_SHA"],
              "image_ref": f"{os.environ['IMAGE']}:{os.environ['SOURCE_SHA']}",
              "image_digest": os.environ["DIGEST"],
              "platform": "linux/amd64",
              "protocol_version": 1,
              "build_timestamp": datetime.now(timezone.utc).isoformat(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "remote_verified": True,
          }
          with open("telegram-executor-release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(out, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Publish immutable verification ref
        run: |
          set -euo pipefail
          REF="refs/maxibot/executor-verified/$SOURCE_SHA"
          if git ls-remote --exit-code origin "$REF" >/dev/null 2>&1; then
            echo "verification ref already exists; refusing overwrite" >&2
            exit 1
          fi
          tmp_manifest="$(mktemp)"
          cp telegram-executor-release-manifest.json "$tmp_manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "verification-$SOURCE_SHA"
          git rm -rf . >/dev/null 2>&1 || true
          cp "$tmp_manifest" telegram-executor-release-manifest.json
          git add telegram-executor-release-manifest.json
          git commit -m "ci: attest telegram executor $SOURCE_SHA"
          git push origin "HEAD:$REF"
          test "$(git ls-remote origin "$REF" | awk '{print $1}' | head -1)" != ""
          test "$(python -c 'import json; print(json.load(open("telegram-executor-release-manifest.json"))["source_sha"])')" = "$SOURCE_SHA"
          echo "CI_VERIFICATION_REF=$REF" >> "$GITHUB_STEP_SUMMARY"
          echo "CI_VERIFICATION_REF_EXISTS=YES" >> "$GITHUB_STEP_SUMMARY"
          echo "CI_VERIFICATION_MANIFEST_MATCH=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegram-executor-${{ env.SOURCE_SHA }}
          path: telegram-executor-release-manifest.json
          if-no-files-found: error
