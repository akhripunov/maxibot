# DORMANT Phase B candidate. GitHub does not discover workflows in this directory.
# CI/build only: no deployment authority, no production secrets, no cutover.
name: MAXIBOT — Native CI and GHCR build candidate
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact 40-character current main SHA; requires OWNER CI/publication authorization
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: MAXIBOT-native-build
  cancel-in-progress: false
env:
  CANDIDATE_SHA: ${{ inputs.candidate }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      MAX_CLIENT_MODE: stub
      MAX_RUN_POLLING: 'false'
      ADS_AUTOPILOT_ENABLED: 'false'
      ADS_WRITE_ACTIONS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main before executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Plan exact candidate against immutable production evidence
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/maxibot_impact_v3.py --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/maxibot-v3-impact.json"
      - name: Check frozen paid-traffic paths against the verified baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPACT_PLAN: ${{ runner.temp }}/maxibot-v3-impact.json
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          RELEASE_TRIGGER_ACTOR: ${{ github.actor }}
          RELEASE_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git diff --check "${CANDIDATE_SHA}^" "$CANDIDATE_SHA"
          python3 -B scripts/prepare_frozen_path_guard.py
          echo 'FROZEN_PATH_REGRESSION=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Install existing test dependencies
        run: |
          python - <<'DEPS' > "$RUNNER_TEMP/test-requirements.txt"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          print('\n'.join(project['dependencies'] + project['optional-dependencies']['test']))
          DEPS
          python -m pip install --no-cache-dir pip==26.2.2
          python -m pip install -r "$RUNNER_TEMP/test-requirements.txt"
      - name: Run the complete exact-candidate MAXIBOT suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/maxibot_impact_v3.py --candidate "$CANDIDATE_SHA" --run-tests "$RUNNER_TEMP/maxibot-v3-impact.json"
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main before executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT_MAIN" = "$CANDIDATE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build once and push directly to GHCR
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akhripunov/maxibot-vps-api:${{ inputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.candidate }}
            org.opencontainers.image.source-sha=${{ inputs.candidate }}
            org.maxibot.release.sha=${{ inputs.candidate }}
            org.opencontainers.image.source=https://github.com/akhripunov/maxibot
            org.opencontainers.image.url=https://github.com/akhripunov/maxibot/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=maxibot-native
          cache-to: type=gha,scope=maxibot-native,mode=max
      - name: Record the immutable build output in the native run summary
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/akhripunov/maxibot-vps-api@$IMAGE_DIGEST"
          docker pull "$IMAGE"
          identity="$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}|{{index .Config.Labels "org.opencontainers.image.revision"}}|{{index .Config.Labels "org.opencontainers.image.source-sha"}}|{{index .Config.Labels "org.maxibot.release.sha"}}')"
          test "$identity" = "linux/amd64|$CANDIDATE_SHA|$CANDIDATE_SHA|$CANDIDATE_SHA"
          printf 'CI_BUILD_ONLY: `%s` → `ghcr.io/akhripunov/maxibot-vps-api@%s`\n' "$CANDIDATE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'MAXIBOT_IMAGE_DIGEST_READBACK=PASS' >> "$GITHUB_STEP_SUMMARY"
